<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0B1D20">
<title>משרד דבול</title><link rel="icon" href="https://mgjmnvpnovkewvqevjmz.supabase.co/functions/v1/app/icon.svg"></head>
<body style="margin:0;background:#0B1D20"><div id="ld" style="display:grid;place-items:center;height:100vh;font:16px Arial,sans-serif;color:#9DB5B2">טוען...</div>
<script>
// links to the courses site, newsletter pages, previews and approvals: a light, neutral loading circle instead of the office screen
if (/^#(r|s|q|g|v|p)=|^#join|^#academy/.test(location.hash)) {
  document.body.style.background = '#f4f4f6';
  document.getElementById('ld').innerHTML = '<span style="width:34px;height:34px;border:3px solid #e2e0da;border-top-color:#a8873f;border-radius:50%;display:block;animation:dsp .8s linear infinite"></span><style>@keyframes dsp{to{transform:rotate(360deg)}}</style>';
}
</script>
<script>
(function(){
  var F = 'https://mgjmnvpnovkewvqevjmz.supabase.co/functions/v1/app/', page = (location.pathname.split('/').pop() || 'index.html');
  if (!/\.html$/.test(page)) page = 'index.html';
  fetch(F + page + '?t=' + Date.now(), { cache:'no-store' }).then(function(r){ if (!r.ok) throw r.status; return r.text(); })
    .then(function(t){ document.open(); document.write(t); document.close(); })
    .catch(function(){ document.getElementById('ld').textContent = 'לא הצלחנו לטעון את המערכת. בדוק את החיבור לאינטרנט ונסה שוב.'; });
})();
</script></body></html>

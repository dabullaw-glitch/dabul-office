.auth-card{background:var(--panel);color:var(--ink);border-radius:20px;padding:30px 26px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);text-align:center}
.auth-card h1{font-size:24px;margin:0 0 4px}
.auth-card form{display:grid;gap:12px;text-align:right;margin-top:16px}
.auth-card label{display:grid;gap:5px;font-weight:700;font-size:14px}
.auth-card input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:var(--panel2);color:var(--ink)}
.auth-err{color:var(--bad);margin:0;font-size:14px}
.auth-note{background:var(--teal-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px;text-align:right}
.auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:14px}
.auth-links a{color:var(--accent);font-weight:700;text-decoration:none}

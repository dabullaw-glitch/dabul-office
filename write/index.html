      +'<label class="f">משפט פתיחה <small>משפט אחד או שניים שמסבירים על מה הטור</small> <span class="cnt" data-c="dek"></span><textarea name="dek" rows="2" maxlength="300"'+dis+'>'+esc(c.dek)+'</textarea></label>'
      +(ed?'<div class="tools"><button type="button" class="b sm" data-t="b"><b>מודגש</b></button><button type="button" class="b sm" data-t="h">כותרת ביניים</button><button type="button" class="b sm" data-t="q">ציטוט</button></div>':'')
      +'<label class="f">הטור <small>שורה ריקה בין פסקאות. לפחות 150 מילים.</small> <span class="cnt" id="wc"></span><textarea name="body" rows="20"'+dis+'>'+esc(body)+'</textarea></label>'
      +'<fieldset style="border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px"><legend style="font-weight:700;font-size:14px;padding:0 6px">תמונה (לא חובה)</legend>'
      +'<div id="imgv">'+(IMG?'<img class="thumb" src="'+esc(IMG)+'" alt="">':'<span class="note">אין תמונה. אפשר להעלות תמונה אחת שצילמתם בעצמכם או שיש לכם רשות לפרסם (JPG, PNG או WEBP, עד 3 מגה).</span>')+'</div>'
      +(ed?'<div class="row"><label class="b sm" style="cursor:pointer">'+(IMG?'החלפת התמונה':'העלאת תמונה')+'<input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden></label>'+(IMG?'<button type="button" class="b sm dang" id="imgdel">הסרת התמונה</button>':'')+'</div>':'')
      +'<label class="f">מה רואים בתמונה <small>לנגישות</small><input name="image_alt" maxlength="200" value="'+esc(c.image_alt)+'"'+dis+'></label></fieldset>'
      +'</form>'
      +(ed?'<div class="save"><button class="b" id="sv">שמירת טיוטה</button><button class="b ok" id="send">שליחה לאישור</button>'+(id&&c.status==='draft'&&!c.submitted_at?'<button class="b dang" id="del">מחיקת הטיוטה</button>':'')+'<span class="note" id="st"></span></div>':'')
      +'<div class="help" style="margin-top:12px"><b>כללים קצרים</b><ul><li>כותבים טור מקורי שלכם. לא מעתיקים מאתרים אחרים, וציטוט קצר בלבד.</li><li>בלי קישורים, בלי טלפון ובלי פרסום לעסק או לאתר שלכם.</li><li>ביקורת כן, האשמות בלי ביסוס נגד אדם או עסק בשמו לא.</li><li>בלי פרטים אישיים של אנשים פרטיים, ובלי הסתה.</li></ul></div></div>'
      +'<div class="pv"><div id="pv"></div></div></div>';
    var f=document.getElementById('cf'),pv=document.getElementById('pv');
    function draw(){pv.innerHTML=preview(f);document.getElementById('wc').textContent=words(f.body.value)+' מילים';f.querySelectorAll('[data-c]').forEach(function(x){var v=f[x.getAttribute('data-c')].value.length;x.textContent=v?v+' תווים':''})}
    draw();DIRTY=false;
    var t=null;f.addEventListener('input',function(){DIRTY=true;clearTimeout(t);t=setTimeout(draw,150)});f.addEventListener('change',function(){DIRTY=true;draw()});
    document.querySelectorAll('.tabs2 [data-v]').forEach(function(b){b.onclick=function(){document.querySelector('.ed').setAttribute('data-v',b.getAttribute('data-v'));document.querySelectorAll('.tabs2 [data-v]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})}});
    if(!ed)return;
    // toolbar: bold wraps the selection, a subheading or a quote starts the current paragraph
    document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){
      var ta=f.body,v=ta.value,s=ta.selectionStart,e=ta.selectionEnd,k=b.getAttribute('data-t');
      if(k==='b'){var sel=v.slice(s,e)||'טקסט מודגש';ta.value=v.slice(0,s)+'**'+sel+'**'+v.slice(e);ta.setSelectionRange(s+2,s+2+sel.length)}
      else{var ps=v.lastIndexOf('\n\n',s-1);ps=ps<0?0:ps+2;var mark=k==='h'?'## ':'> ';var line=v.slice(ps).replace(/^(##\s|>\s)/,'');
        var had=v.slice(ps,ps+3)===mark||v.slice(ps,ps+2)===mark;ta.value=v.slice(0,ps)+(had?'':mark)+line;var np=ps+(had?0:mark.length);ta.setSelectionRange(np,np)}
      ta.focus();DIRTY=true;draw()}});
    var cur=id;
    function data(){return{id:cur||undefined,section:f.section.value,title:f.title.value,dek:f.dek.value,body:f.body.value,image_alt:f.image_alt.value}}
    function save(btn,then){return act(btn,call('save',data()),function(r){DIRTY=false;var first=!cur;cur=r.id;document.getElementById('st').textContent='נשמר '+when(new Date().toISOString());if(first)history.replaceState(null,'','#edit/'+cur),LAST='edit/'+cur;then&&then(r)})}
    document.getElementById('sv').onclick=function(){save(this,function(){toast('הטיוטה נשמרה')})};
    document.getElementById('send').onclick=function(){
      var b=this;if(!f.title.value.trim()||!f.dek.value.trim())return toast('חסרים כותרת או משפט פתיחה',true);
      if(words(f.body.value)<150)return toast('הטור קצר מדי. צריך לפחות 150 מילים.',true);
      if(!confirm('לשלוח את הטור לאישור העורך? אחרי השליחה אי אפשר לערוך עד שהוא יפורסם או יוחזר אליכם.'))return;
      save(b,function(){act(b,call('submit',{id:cur}),function(){DIRTY=false;toast('הטור נשלח לאישור. תודה!');location.hash='#edit/'+cur;route()})})};
    var del=document.getElementById('del');if(del)del.onclick=function(){if(!confirm('למחוק את הטיוטה? אי אפשר לשחזר.'))return;act(del,call('delete',{id:cur}),function(){DIRTY=false;toast('הטיוטה נמחקה');location.hash='#list'})};
    var idel=document.getElementById('imgdel');if(idel)idel.onclick=function(){act(idel,call('image_del',{id:cur}),function(){toast('התמונה הוסרה');IMG='';vEdit(cur)})};
    var fi=document.getElementById('file');if(fi)fi.onchange=function(){
      var file=fi.files&&fi.files[0];if(!file)return;
      if(!/^image\/(jpeg|png|webp)$/.test(file.type))return toast('אפשר להעלות רק תמונה מסוג JPG, PNG או WEBP',true);
      if(file.size>12*1024*1024)return toast('התמונה גדולה מדי',true);
      toast('מעלה את התמונה...');
      shrink(file,function(dataUrl){var go=function(){act(null,call('image',{id:cur,data:dataUrl}),function(r){IMG=r.image_url;toast('התמונה הועלתה');vEdit(cur)})};
        if(!cur)save(null,go);else if(DIRTY)save(null,go);else go()});
    };
  }).catch(function(){});
}
// big photos are made smaller in the browser (up to 1600 pixels wide, JPEG) so they stay under 3 MB
function shrink(file,cb){
  var rd=new FileReader();rd.onload=function(){var url=rd.result;
    if(file.size<=2.5*1024*1024&&file.type!=='image/png')return cb(url);
    var im=new Image();im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,1600/w);var cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.86))};im.onerror=function(){cb(url)};im.src=url};
  rd.readAsDataURL(file);
}
route();
})();
})();</script> </body> </html>

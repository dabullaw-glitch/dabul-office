var TABS=[['dash','סקירה'],['stories','כתבות','stories'],['new','כתבה חדשה'],['columns','טורי דעה','columns'],['flashes','מבזקים'],['events','אירוע מיוחד'],['requests','פניות','requests'],['listings','מדריך עסקים','listings'],['sources','מקורות'],['stats','סטטיסטיקה'],['log','יומן']];

// ---------- login (password, then a code from Telegram) ----------
function brand(){return '<span class="brand"><span class="mk">NWS<i></i></span><span><b>חדשות נתניה והשרון</b><span>לוח ניהול</span></span></span>'}
function box(inner){stopTimer();root.innerHTML='<div class="login">'+brand()+inner+'<p id="lm" role="alert"></p></div>'}
function say(t,ok){var m=document.getElementById('lm');if(m){m.style.color=ok?'#17803F':'#7A1220';m.textContent=t||''}}
function busy(btn,p,then){btn.disabled=true;say('רגע...',true);p.then(function(j){btn.disabled=false;then(j)}).catch(function(){btn.disabled=false;say('אין חיבור. נסו שוב.')})}
function setupBtn(id){var b=document.getElementById(id);if(!b)return;b.onclick=function(){busy(b,post({action:'setup_link'}),function(j){say(j.ok?j.message:(j.error||'נכשל'),j.ok)})}}
var pwRules='לפחות 12 תווים, ולפחות 3 מתוך 4: אותיות קטנות (או עברית), אותיות גדולות באנגלית, ספרות, סימנים. לא סיסמה שאתם משתמשים בה במקום אחר.';
function setupView(k){
  box('<h1>בחירת סיסמה ללוח הניהול</h1><p>'+pwRules+'</p><form id="sf"><label class="f">סיסמה חדשה<input type="password" name="p1" autocomplete="new-password" required minlength="12" dir="ltr"></label>'
    +'<label class="f">שוב את אותה סיסמה<input type="password" name="p2" autocomplete="new-password" required dir="ltr"></label><label class="chk"><input type="checkbox" id="sh"> להציג את הסיסמה</label>'
    +'<button class="b pri">שמירת הסיסמה</button></form>');
  var f=document.getElementById('sf');
  document.getElementById('sh').onchange=function(){f.p1.type=f.p2.type=this.checked?'text':'password'};
  f.onsubmit=function(e){e.preventDefault();if(f.p1.value!==f.p2.value)return say('שתי הסיסמאות לא זהות');
    busy(f.querySelector('button'),post({action:'set_password',k:k,password:f.p1.value}),function(j){if(j.ok){f.reset();loginView(j.message,true)}else say(j.error||'נכשל')})};
}
function loginView(note,good){
  try{localStorage.removeItem(KEY)}catch(e){}S=null;DIRTY=false;
  box('<h1>כניסה ללוח הניהול</h1><div id="lv"><div class="ld">טוען...</div></div>');
  if(note)say(note,good);
  post({action:'state'}).then(function(st){
    var lv=document.getElementById('lv');
    if(!st.pw_set){lv.innerHTML='<p>עוד לא נבחרה סיסמה. לוחצים על הכפתור, ומקבלים בטלגרם (בבוט של המשרד) כפתור לבחירת סיסמה. רק אתם מקבלים אותו.</p><button class="b pri" id="su" style="width:100%">הגדרת סיסמה</button>';return setupBtn('su')}
    lv.innerHTML='<form id="lf"><label class="f">סיסמה<input type="password" name="pw" autocomplete="current-password" required dir="ltr"></label><button class="b pri">המשך</button></form>'
      +'<p class="note" style="margin-top:14px">אחרי הסיסמה יישלח אליכם קוד בן 6 ספרות בטלגרם.</p><button class="b" id="fg">שכחתי את הסיסמה</button>';
    setupBtn('fg');
    var f=document.getElementById('lf');f.pw.focus();
    f.onsubmit=function(e){e.preventDefault();busy(f.querySelector('button'),post({action:'login',password:f.pw.value}),function(j){if(j.ok){f.pw.value='';codeView(j.pre)}else say(j.error||'נכשל')})};
  }).catch(function(){say('אין חיבור. נסו שוב.')});
}
function codeView(pre){
  box('<h1>קוד מטלגרם</h1><p>שלחנו לכם קוד בן 6 ספרות בטלגרם (בבוט של המשרד). הקוד תקף ל-5 דקות.</p><form id="cf"><label class="f">הקוד<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required dir="ltr" style="font-size:26px;letter-spacing:8px;text-align:center"></label><button class="b pri">כניסה</button></form>');
  var f=document.getElementById('cf');f.code.focus();
  f.onsubmit=function(e){e.preventDefault();busy(f.querySelector('button'),post({action:'otp',pre:pre,code:f.code.value}),function(j){
    if(j.ok){S=j.s;try{localStorage.setItem(KEY,S)}catch(e){}if(!location.hash||/setup/.test(location.hash))history.replaceState(null,'',location.pathname+'#dash');shell();route()}else if(j.again){loginView(j.error)}else{f.code.value='';say(j.error||'נכשל')}})};
}

// ---------- the frame ----------
function badge(t){return t[2]&&SUM[t[2]]?'<i>'+SUM[t[2]]+'</i>':''}
function shell(){
  if(document.getElementById('main'))return;
  var nav=TABS.map(function(t){return '<a href="#'+t[0]+'" data-t="'+t[0]+'">'+icon(t[0])+'<span>'+t[1]+'</span>'+badge(t)+'</a>'}).join('');
  root.innerHTML='<div class="app"><aside class="side"><a class="brand" href="#dash"><span class="mk">NWS<i></i></span><span><b>חדשות נתניה והשרון</b><span>לוח ניהול</span></span></a><nav class="nav" aria-label="אזורי הניהול">'+nav+'</nav>'
    +'<div class="foot"><a href="/" target="_blank" rel="noopener">לאתר</a><button type="button" data-out>יציאה</button></div></aside>'
    +'<header class="top"><div class="r"><a class="brand" href="#dash" style="border:0;color:#fff"><span class="mk">NWS<i></i></span><span><b>לוח ניהול</b></span></a><span class="row"><a href="/" target="_blank" rel="noopener">לאתר</a><button type="button" data-out>יציאה</button></span></div>'
    +'<nav class="tabs" aria-label="אזורי הניהול">'+TABS.map(function(t){return '<a href="#'+t[0]+'" data-t="'+t[0]+'">'+t[1]+badge(t)+'</a>'}).join('')+'</nav></header>'
    +'<main id="main"></main></div>';
  root.querySelectorAll('[data-out]').forEach(function(b){b.onclick=function(){if(!confirm('לצאת מלוח הניהול?'))return;call('logout').catch(function(){}).then(function(){loginView('יצאתם מלוח הניהול.',true)})}});
  summary();
}
function setNav(tab){
  root.querySelectorAll('[data-t]').forEach(function(a){if(a.getAttribute('data-t')===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  var c=root.querySelector('.tabs [aria-current]');if(c&&c.scrollIntoView)c.scrollIntoView({inline:'center',block:'nearest'});
}
function summary(){return call('summary').then(function(j){if(!j.ok)return;SUM=j;TABS.forEach(function(t){if(!t[2])return;root.querySelectorAll('[data-t="'+t[0]+'"]').forEach(function(a){var i=a.querySelector('i');if(i)i.remove();if(SUM[t[2]])a.insertAdjacentHTML('beforeend','<i>'+SUM[t[2]]+'</i>')})})}).catch(function(){})}
function main(){return document.getElementById('main')}
function page(h,sub,right){return '<div class="ph"><div><h1>'+h+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+(right||'')+'</div>'}
function stopTimer(){if(TIMER){clearInterval(TIMER);TIMER=null}}
function every(ms,fn){stopTimer();TIMER=setInterval(function(){if(!document.hidden)fn()},ms)}
var LAST_HASH='';
function route(){
  if(!S)return;
  var h=(location.hash||'').replace(/^#\/?/,'');
  if(DIRTY&&h!==LAST_HASH){if(!confirm('יש שינויים שלא נשמרו. לצאת בלי לשמור?')){history.replaceState(null,'','#'+LAST_HASH);return}DIRTY=false}
  LAST_HASH=h;stopTimer();shell();
  var p=h.split('/'),t=p[0]||'dash',arg=p[1]||'';
  var V={columns:vColumns,col:vCol,dash:vDash,stories:vStories,story:vStory,new:vNew,flashes:vFlashes,events:vEvents,requests:vRequests,listings:vListings,sources:vSources,stats:vStats,log:vLog}[t];
  if(!V){location.hash='#dash';return}
  setNav(t==='story'?'stories':t==='col'?'columns':t);
  main().innerHTML='<div class="ld">טוען...</div>';window.scrollTo(0,0);
  V(arg);
}
addEventListener('hashchange',route);
addEventListener('beforeunload',function(e){if(DIRTY){e.preventDefault();e.returnValue=''}});

// ---------- shared story bits ----------
var STATE={published:'באתר',draft:'טיוטה',needs_check:'לבדיקה',approved:'מאושרת',withdrawn:'הורדה מהאתר',rejected:'נדחתה'};
var KIND={news:'חדשות',opinion:'דעה',sponsored:'תוכן שיווקי'};
function stBadge(s){var w=(s.state==='draft'||s.state==='needs_check')&&(s.tg_sent_at||s.hold);return '<span class="bdg '+esc(s.state)+(s.hold?' hold':'')+'">'+(w?'ממתינה לאישור':STATE[s.state]||esc(s.state))+'</span>'}
function secTag(k){var s=SEC[k];return s?'<span class="sec" style="--c:'+s.c+'">'+esc(s.n)+'</span>':''}
function storyUrl(s){var x=SEC[s.section]||SEC.flash;return '/'+x.slug+'/n'+s.id+'/'}
function storyRow(s,pin){
  return '<a class="li" href="#story/'+s.id+'">'+(s.image_url?'<img src="'+esc(href(s.image_url))+'" alt="" loading="lazy">':'')+'<div class="m"><div class="x">'+stBadge(s)+secTag(s.section)
    +(s.kind==='sponsored'?'<span class="bdg spon">תוכן שיווקי</span>':s.kind==='opinion'?'<span class="bdg">דעה</span>':'')
    +(s.sensitivity==='sensitive'?'<span class="bdg sens">רגישה</span>':'')+(pin&&pin.id===s.id?'<span class="bdg pin">נעוצה בראש האתר</span>':'')
    +'<span>#'+s.id+'</span><span>'+(s.published_at&&s.state==='published'?'פורסמה '+when(s.published_at):'נוצרה '+when(s.created_at))+'</span></div>'
    +'<div class="t">'+esc(s.title||'בלי כותרת')+'</div>'+(s.dek?'<div class="d">'+esc(s.dek)+'</div>':'')+(s.pub_note&&s.state!=='published'?'<div class="d note">'+esc(s.pub_note)+'</div>':'')+'</div>'
    +(s.views!=null?'<div class="v"><b class="num">'+num(s.views)+'</b><span>צפיות</span></div>':'')+'</a>';
}
// the site's mini markup for sponsored articles (## heading, - list, 1. list, > quote | source, [text](https://...))
function inl(x){return esc(x).replace(/\[([^\]\n]{1,200})\]\(((?:https?:\/\/|\/)[^\s()<>"]+)\)/g,function(m,t,h){return '<a href="'+h+'" target="_blank" rel="noopener">'+t+'</a>'})}
function blocks(paras,spon){return paras.map(function(p){
  if(!spon)return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>';
  // 29.10.2026: cut every paragraph line by line (a heading, a sentence and a list can share one stored paragraph)
  var ls=p.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean),o='',i=0,li;
  while(i<ls.length){var x=ls[i];
    if(/^#{1,3}\s/.test(x)){o+='<h2>'+inl(x.replace(/^#{1,3}\s*/,''))+'</h2>';i++;continue}
    if(/^>\s/.test(x)){var q=x.replace(/^>\s*/,'').split(/\s*\|\s*/);o+='<blockquote>'+esc(q[0])+(q[1]?'<div class="note">'+esc(q[1])+'</div>':'')+'</blockquote>';i++;continue}
    if(/^[-•*]\s/.test(x)){li=[];while(i<ls.length&&/^[-•*]\s/.test(ls[i]))li.push('<li>'+inl(ls[i++].replace(/^[-•*]\s*/,''))+'</li>');o+='<ul>'+li.join('')+'</ul>';continue}
    if(/^\d+[.)]\s/.test(x)){li=[];while(i<ls.length&&/^\d+[.)]\s/.test(ls[i]))li.push('<li>'+inl(ls[i++].replace(/^\d+[.)]\s*/,''))+'</li>');o+='<ol>'+li.join('')+'</ol>';continue}
    var pl=[];while(i<ls.length&&!/^(#{1,3}|>|[-•*]|\d+[.)])\s/.test(ls[i]))pl.push(inl(ls[i++]));o+='<p>'+pl.join('<br>')+'</p>'}
  return o;
}).join('')}
function splitParas(t){return String(t||'').replace(/\r/g,'').split(/\n[ \t]*\n/).map(function(p){return p.split('\n').map(function(l){return l.trim()}).filter(Boolean).join('\n')}).filter(Boolean)}
function dashes(t){return String(t||'').replace(/\s*\u2014\s*/g,', ').replace(/\s*\u2013\s*/g,' - ')}
function preview(f){
  var spon=f.kind==='sponsored',s=SEC[f.section]||SEC.city,paras=(Array.isArray(f.body)?f.body:splitParas(f.body)).map(dashes);
  var lbl=f.image_url?(f.image_model?'תמונה להמחשה':f.image_credit?'צילום: '+f.image_credit:spon?'צילום: באדיבות המפרסם':'צילום'):'';
  return '<div class="pvw"><div class="lb"><span>תצוגה מקדימה (בערך כמו באתר)</span><span>'+esc(KIND[f.kind]||'')+'</span></div>'
    +'<div class="k" style="--c:'+s.c+'">'+(spon?'<span class="spon">תוכן שיווקי</span>':'')+'<span>'+esc(dashes(f.kicker)||s.n)+'</span></div>'
    +'<h1>'+esc(dashes(f.title)||'כותרת')+'</h1>'+(f.dek?'<p class="dk">'+esc(dashes(f.dek))+'</p>':'')
    +'<div class="by">'+(spon?(f.author?'בשיתוף '+esc(f.author):'תוכן שיווקי'):f.kind==='opinion'?esc(f.author||'כותב הטור'):'מערכת חדשות נתניה והשרון')+'</div>'
    +(f.image_url?'<figure><img src="'+esc(href(f.image_url))+'" alt="'+esc(f.image_alt||'')+'"><figcaption>'+esc(f.image_alt?f.image_alt+' · ':'')+esc(lbl)+'</figcaption></figure>':'')
    +(f.key_points&&f.key_points.length?'<div class="kp"><b>בקצרה</b><ul>'+f.key_points.map(function(k){return '<li>'+esc(dashes(k))+'</li>'}).join('')+'</ul></div>':'')
    +'<div class="bd">'+(paras.length?blocks(paras,spon):'<p class="note">הטקסט יופיע כאן</p>')+'</div>'
    +(spon&&f.links&&f.links.length?'<div class="kp"><b>לפרטים נוספים אצל המפרסם</b><ul>'+f.links.map(function(l){return '<li><a href="'+esc(href(l.url))+'" target="_blank" rel="noopener">'+esc(l.text)+'</a></li>'}).join('')+'</ul></div>':'')
    +(f.faq&&f.faq.length?'<div class="faq"><h2 class="h">שאלות ותשובות</h2>'+f.faq.map(function(x){return '<b>'+esc(x.q)+'</b><div>'+esc(x.a)+'</div>'}).join('')+'</div>':'')
    +(spon?'<p class="disc">הכתבה פורסמה כתוכן שיווקי בשיתוף המפרסם</p>':'')+'</div>';
}
function faqOf(a){return (Array.isArray(a)?a:[]).map(function(x){return Array.isArray(x)?{q:x[0],a:x[1]}:{q:x&&(x.q||x.question)||'',a:x&&(x.a||x.answer)||''}}).filter(function(x){return x.q||x.a})}
function opt(v,l,cur){return '<option value="'+esc(v)+'"'+(String(v)===String(cur)?' selected':'')+'>'+esc(l)+'</option>'}
function faqRow(x){return '<div class="fg2 fq" style="border-top:1px dashed var(--line);padding-top:8px"><label class="f">שאלה<input name="fq" value="'+esc(x.q)+'"></label><label class="f">תשובה<textarea name="fa" rows="2">'+esc(x.a)+'</textarea></label></div>'}
function linkRow(x){return '<div class="fg2 lk"><label class="f">טקסט הקישור<input name="lt" value="'+esc(x.text)+'" placeholder="למשל: לאתר המשרד"></label><label class="f">כתובת<input name="lu" dir="ltr" value="'+esc(x.url)+'" placeholder="https://"></label></div>'}
// the story form (edit and new)

    +'<label class="f">נקודות עיקריות <small>שורה לכל נקודה, עד 8, לא חובה</small><textarea name="key_points" rows="4">'+esc(kp)+'</textarea></label>'
    +'<fieldset><legend>תמונה</legend><label class="f">קישור לתמונה <small>מתחיל ב-https://. ריק = המערכת תיצור תמונה להמחשה (לא בתוכן שיווקי)</small><input name="image_url" dir="ltr" value="'+esc(st.image_url||'')+'" placeholder="https://"></label>'
    +'<div class="fg2"><label class="f">תיאור התמונה (לנגישות)<input name="image_alt" value="'+esc(st.image_alt||'')+'"></label><label class="f">קרדיט <small>למשל: באדיבות המפרסם, או שם הצלם</small><input name="image_credit" value="'+esc((st.extras&&st.extras.image_credit)||'')+'"></label></div>'

    key_points:f.key_points.value.split('\n').map(function(x){return x.trim()}).filter(Boolean),faq:faq,places:f.places.value.split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean),
    image_url:f.image_url.value.trim(),image_alt:f.image_alt.value.trim(),image_credit:f.image_credit.value.trim(),sensitivity:f.sensitivity.value,

function bindForm(f,onChange){
  var pv=function(){onChange&&onChange()};
  var t=null;f.addEventListener('input',function(){DIRTY=true;clearTimeout(t);t=setTimeout(function(){counts();thumb();pv()},150)});
  f.addEventListener('change',function(){DIRTY=true;kindVis();pv()});
  function kindVis(){var k=f.kind.value;f.querySelectorAll('[data-spon]').forEach(function(x){x.hidden=k!=='sponsored'});f.querySelectorAll('[data-op]').forEach(function(x){x.hidden=k!=='opinion'})}

  f.querySelector('[data-addlink]').onclick=function(){f.querySelector('[data-links]').insertAdjacentHTML('beforeend',linkRow({text:'',url:''}))};
  f.querySelectorAll('[data-pl]').forEach(function(b){b.onclick=function(){var p=b.getAttribute('data-pl'),list=f.places.value.split(/[,\n]/).map(function(x){return x.trim()}).filter(Boolean),i=list.indexOf(p);
    if(i>=0)list.splice(i,1);else list.push(p);f.places.value=list.join(', ');b.setAttribute('aria-pressed',String(i<0));DIRTY=true;pv()}});
  f.places.addEventListener('input',function(){var list=f.places.value.split(/[,\n]/).map(function(x){return x.trim()});f.querySelectorAll('[data-pl]').forEach(function(b){b.setAttribute('aria-pressed',String(list.indexOf(b.getAttribute('data-pl'))>=0))})});

// ---------- סקירה ----------
function kpi(label,val,sub,link,hot){return '<'+(link?'a href="'+link+'"':'div')+' class="kpi'+(hot?' hot':'')+'"><span>'+label+'</span><b class="num">'+val+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</'+(link?'a':'div')+'>'}
function bars(daily,h){
  daily=daily||[];if(!daily.length)return '';
  var W=Math.max(300,daily.length*22),H=h||160,pad=22,max=Math.max(1,Math.max.apply(null,daily.map(function(d){return d.views||0})));
  var bw=(W-8)/daily.length,out='';
  daily.forEach(function(d,i){var x=W-4-(i+1)*bw+2,v=(d.views||0)/max*(H-pad-8),e=(d.entries||0)/max*(H-pad-8);
    out+='<g><title>'+esc(dayName(d.day+'T12:00:00Z'))+': '+num(d.views)+' צפיות, '+num(d.entries)+' ביקורים</title><rect x="'+x.toFixed(1)+'" y="'+(H-pad-v).toFixed(1)+'" width="'+Math.max(2,bw-4).toFixed(1)+'" height="'+v.toFixed(1)+'" rx="2" fill="#C9CED8"/>'
      +'<rect x="'+x.toFixed(1)+'" y="'+(H-pad-e).toFixed(1)+'" width="'+Math.max(2,bw-4).toFixed(1)+'" height="'+e.toFixed(1)+'" rx="2" fill="#0D1321"/></g>';
    if(daily.length<=10||i%Math.ceil(daily.length/8)===0)out+='<text x="'+(x+bw/2-2).toFixed(1)+'" y="'+(H-6)+'" font-size="10" text-anchor="middle" fill="#5E6776">'+esc(fmt(d.day+'T12:00:00Z',{day:'numeric',month:'numeric'}))+'</text>';
  });
  out+='<text x="'+(W-4)+'" y="11" font-size="10" text-anchor="end" fill="#5E6776">'+num(max)+'</text><line x1="0" x2="'+W+'" y1="'+(H-pad)+'" y2="'+(H-pad)+'" stroke="#E4E1D9"/>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="צפיות וביקורים לפי יום">'+out+'</svg><div class="legend"><span style="--c:#C9CED8">צפיות בעמודים</span><span style="--c:#0D1321">ביקורים (כניסות לאתר)</span></div>';
}

      +kpi('עכשיו באתר',num(v.now.views),'צפיות ב-30 הדקות האחרונות','#stats')+kpi('פורסמו היום',num(c.published_today),'','#stories/published')
      +kpi('ממתינות לאישור',num(c.stories),'','#stories/waiting',c.stories>0)+kpi('פניות חדשות',num(c.requests),'','#requests',c.requests>0)+kpi('עסקים ממתינים',num(c.listings),'','#listings',c.listings>0)+'</div>'

function cInl(x){return esc(x).replace(/\*\*([^*\n]{1,300}?)\*\*/g,'<b>$1</b>')}

function fileData(input,cb){var f=input&&input.files&&input.files[0];if(!f)return cb(null);if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast('רק JPG, PNG או WEBP',true);return cb(false)}
  var rd=new FileReader();rd.onload=function(){var url=rd.result;if(f.size<=2.5*1024*1024)return cb({data:url});var im=new Image();im.onload=function(){var k=Math.min(1,800/im.naturalWidth),cv=document.createElement('canvas');cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb({data:cv.toDataURL('image/jpeg',.88)})};im.src=url};rd.readAsDataURL(f)}
function showCode(name,code){

    +'<div class="row"><button class="b" type="button" id="cpy">העתקת הקוד</button><button class="b" type="button" id="cpy2">העתקת הודעה מוכנה לכותב</button><button class="b" type="button" id="cclose">סגירה</button></div></div>');
  var msg='שלום '+name+',\nהצטרפת לכותבי טורי הדעה באתר חדשות נתניה והשרון.\nכניסה: https://nws.co.il/write/\nהמייל שלך, והקוד האישי: '+code+'\nאת הקוד לא מעבירים לאף אחד.';
  var cp=function(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('הועתק')},function(){prompt('',t)});else prompt('',t)};

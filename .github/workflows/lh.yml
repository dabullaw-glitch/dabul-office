name: lighthouse
on:
  push:
    branches: [audit-run]
    paths: ['lh/**', '.github/workflows/lh.yml']
permissions:
  contents: write
jobs:
  lh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run
        run: |
          mkdir -p diag-results/lh
          npm i -g lighthouse@12.8.2 >/dev/null 2>&1
          L() { lighthouse "$1" --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="$2" $3 || true; }
          for i in 1 2 3; do
            L "https://dabullaw.co.il/?x=$RANDOM" diag-results/lh/live-d$i.json --preset=desktop
            L "https://dabullaw.co.il/?dblprev=1&x=$RANDOM" diag-results/lh/prev-d$i.json --preset=desktop
          done
          for i in 1 2; do
            L "https://dabullaw.co.il/?x=$RANDOM" diag-results/lh/live-m$i.json
            L "https://dabullaw.co.il/?dblprev=1&x=$RANDOM" diag-results/lh/prev-m$i.json
          done
          node lh/sum2.mjs diag-results/lh/live-d1.json diag-results/lh/prev-d1.json diag-results/lh/live-m1.json diag-results/lh/prev-m1.json
          node -e "const fs=require('fs');const o={};for(const f of fs.readdirSync('diag-results/lh').filter(f=>/^(live|prev)-/.test(f))){try{const r=JSON.parse(fs.readFileSync('diag-results/lh/'+f));o[f]=Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)]));o[f].cls=r.audits['cumulative-layout-shift'].displayValue;o[f].lcp=r.audits['largest-contentful-paint'].displayValue;o[f].fcp=r.audits['first-contentful-paint'].displayValue}catch(e){o[f]=String(e)}}fs.writeFileSync('diag-results/lh/scores.json',JSON.stringify(o,null,1))"
          rm -f diag-results/lh/live-*.json diag-results/lh/prev-*.json
      - name: Commit
        if: always()
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add diag-results/lh
          git commit -m "lighthouse $(date -u +%FT%TZ)" || echo nothing
          for i in 1 2 3 4 5; do git pull --rebase -q origin audit-run && git push origin HEAD:audit-run && break; sleep 7; done

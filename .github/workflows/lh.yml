name: lighthouse
on:
  push:
    branches: [audit-run]
    paths: ['lh/**', '.github/workflows/lh.yml']
permissions:
  contents: write
jobs:
  lh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run
        run: |
          mkdir -p diag-results/lh
          for i in 1 2 3; do npx -y lighthouse@12.8.2 "https://dabullaw.co.il/?lh=$RANDOM" --quiet --preset=desktop --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=diag-results/lh/d$i.json || true; done
          npx -y lighthouse@12.8.2 "https://dabullaw.co.il/?lh=$RANDOM" --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=diag-results/lh/m1.json || true
          node lh/sum2.mjs diag-results/lh/d1.json diag-results/lh/d2.json diag-results/lh/d3.json diag-results/lh/m1.json
          rm -f diag-results/lh/*.json.tmp; mkdir -p diag-results/lh/raw; gzip -c diag-results/lh/d1.json > diag-results/lh/raw/d1.json.gz; gzip -c diag-results/lh/m1.json > diag-results/lh/raw/m1.json.gz; rm -f diag-results/lh/d?.json diag-results/lh/m1.json
      - name: Commit
        if: always()
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add diag-results/lh
          git commit -m "lighthouse $(date -u +%FT%TZ)" || echo nothing
          for i in 1 2 3 4 5; do git pull --rebase -q origin audit-run && git push origin HEAD:audit-run && break; sleep 7; done

name: reel lab (internal)
# Prepares raw talking-head footage for the reel editor v2 (HyperFrames): downloads the raw take from Google Drive,
# makes a 1080x1920 working copy, and transcribes it word by word in Hebrew (faster-whisper, ivrit-ai model).
# Trigger: push to branch tools/reel-lab that changes reel-lab.txt (lines: "<name> <driveFileId or download link>").
# Output (committed back to the same branch, never to main, so nothing is published): reel-lab/<name>/{proxy.mp4,words.json,info.json}
on:
  push:
    branches: [tools/reel-lab]
    paths: [reel-lab.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: reel-lab, cancel-in-progress: false }
jobs:
  prep:
    if: "!contains(github.event.head_commit.message, '[reel-lab]')"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
          pip install -q faster-whisper==1.1.1 scipy numpy opencv-python-headless==4.10.0.84
      - name: Download, working copy, transcript
        run: |
          set -e
          mkdir -p reel-lab; exec > >(tee -a reel-lab/_log.txt) 2>&1
          while read -r name id; do
            case "$name" in \#*|"") continue;; esac; [ -n "$id" ] || continue
            out="reel-lab/$name"; [ -f "$out/words.json" ] && [ -f "$out/faces.json" ] && { echo "skip $name"; continue; }
            mkdir -p "$out" /tmp/raw
            # a Drive file id, or (15.10.2026) a full link, e.g. the joined download link that rawq gives for a phone upload
            case "$id" in http*) src="$id";; *) src="https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t";; esac
            curl -fsSL --retry 3 "$src" -o /tmp/raw/$name.mov < /dev/null
            ls -la /tmp/raw/$name.mov
            ffprobe -v error  -show_entries stream=codec_type,width,height,r_frame_rate,duration:stream_tags=rotate:format=duration -of json /tmp/raw/$name.mov > "$out/info.json" < /dev/null
            cat "$out/info.json"
            # working copy: portrait 1080x1920, 30 fps, good quality, small enough for git (< 95 MB)
            crf=23
            [ -f "$out/proxy.mp4" ] || while :; do
              ffmpeg -nostdin -y -v error -i /tmp/raw/$name.mov -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30" \
                -c:v libx264 -preset slow -crf $crf -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart "$out/proxy.mp4"
              s=$(stat -c %s "$out/proxy.mp4"); echo "crf $crf -> $s bytes"
              [ "$s" -lt 95000000 ] && break; crf=$((crf+3))
            done
            ffmpeg -nostdin -y -v error -i /tmp/raw/$name.mov -vn -ac 1 -ar 16000 /tmp/raw/$name.wav
            python3 tools/reel-lab/transcribe.py "$out" /tmp/raw/$name.wav < /dev/null
            [ -f "$out/faces.json" ] || python3 tools/reel-lab/facetrack.py "$out/proxy.mp4" "$out/faces.json" 0.2 < /dev/null || echo "facetrack failed for $name"
            rm -f /tmp/raw/$name.mov /tmp/raw/$name.wav
            # save each take as soon as it is ready, so a long batch never loses finished work
            git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
            git add "$out" reel-lab/_log.txt; git commit -qm "[reel-lab] prepared $name" || true
            for i in 1 2 3 4 5; do git pull --rebase -q origin tools/reel-lab < /dev/null && git push -q origin HEAD:tools/reel-lab < /dev/null && break; sleep 6; done
          done < reel-lab.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          git add reel-lab
          git commit -qm "[reel-lab] prepared $(ls reel-lab | paste -sd' ' -)" || { echo nothing; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase -q origin tools/reel-lab && git push origin HEAD:tools/reel-lab && break; sleep 6; done

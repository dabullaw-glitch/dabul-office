name: fetch media (internal)
# Internal helper branch: downloads the files listed in fetch-list.txt and commits them under fetched/.
# shots.txt lines "name url" are captured as full-page screenshots (desktop + phone) into fetched/shots/.
# check.txt lines "name url" are only checked (HTTP status + final URL) into fetched/check.tsv.
# Nothing here is published (GitHub Pages serves only main).
on:
  push:
    branches: [tools/fetch-media]
    paths: [fetch-list.txt, shots.txt, check.txt, lh.txt]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[fetched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        continue-on-error: true
        run: |
          mkdir -p fetched
          while read -r name url; do [ -n "$url" ] && { curl -fsSL --retry 3 -A "dabul-fetch/1.0 (https://dabullaw.co.il; office@dabullaw.co.il)" "$url" -o "fetched/$name" || echo "fail $name"; }; done < fetch-list.txt
          ls -la fetched
      - name: Check links
        continue-on-error: true
        run: |
          mkdir -p fetched
          : > fetched/check.tsv
          if [ -f check.txt ]; then while read -r name url; do [ -n "$url" ] || continue; r=$(curl -sS -o /tmp/body -L --max-time 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36" -w '%{http_code}\t%{content_type}\t%{size_download}\t%{url_effective}' "$url" 2>&1 | tr '\n' ' '); printf '%s\t%s\t%s\n' "$name" "$r" "$url" >> fetched/check.tsv; done < check.txt; fi
          cat fetched/check.tsv
      - name: Screenshots
        continue-on-error: true
        timeout-minutes: 12
        run: |
          [ -s shots.txt ] || exit 0
          mkdir -p fetched/shots /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null
          npm i playwright@1.47.2 > $GITHUB_WORKSPACE/fetched/shots/log.txt 2>&1
          npx playwright install --with-deps chromium >> $GITHUB_WORKSPACE/fetched/shots/log.txt 2>&1
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const lines = fs.readFileSync(process.argv[2],'utf8').split('\n').filter(l=>l.trim());
          const b = await chromium.launch();
          for (const l of lines) {
            const [name,url,js] = l.trim().split(/\s+/);
            for (const [tag,vp,mob] of [['d',{width:1440,height:900},false],['m',{width:390,height:844},true]]) {
              const c = await b.newContext({viewport:vp,isMobile:mob,hasTouch:mob,deviceScaleFactor:1,locale:'he-IL'});
              const p = await c.newPage();
              await p.addInitScript(()=>{ window.__cls=0; window.__shifts=[]; try{ new PerformanceObserver(l=>{ for(const e of l.getEntries()){ if(e.hadRecentInput) continue; window.__cls+=e.value; window.__shifts.push({v:+e.value.toFixed(4),t:Math.round(e.startTime),src:(e.sources||[]).map(s=>{const n=s.node; if(!n||!n.tagName) return '?'; return n.tagName.toLowerCase()+(n.id?'#'+n.id:'')+(n.className&&typeof n.className==='string'?'.'+n.className.trim().split(/\s+/).slice(0,3).join('.'):'')+' '+JSON.stringify(s.previousRect?{y:Math.round(s.previousRect.y),h:Math.round(s.previousRect.height)}:{})+'->'+JSON.stringify(s.currentRect?{y:Math.round(s.currentRect.y),h:Math.round(s.currentRect.height)}:{});})}); } }).observe({type:'layout-shift',buffered:true}); }catch(e){} });
              try {
                await p.goto(url,{waitUntil:'load',timeout:60000});
                await p.waitForTimeout(3000);
                const cls1 = await p.evaluate(()=>({cls:+window.__cls.toFixed(4),shifts:window.__shifts}));
                for (let y=0;y<30000;y+=500){ await p.evaluate(v=>window.scrollTo(0,v),y); await p.waitForTimeout(120); }
                await p.evaluate(()=>window.scrollTo(0,0)); await p.waitForTimeout(1500);
                const cls2 = await p.evaluate(()=>({cls:+window.__cls.toFixed(4),n:window.__shifts.length,shifts:window.__shifts.slice(0,25)}));
                fs.appendFileSync(`${process.env.OUT}/cls.txt`, JSON.stringify({name,tag,loadCls:cls1.cls,afterScrollCls:cls2.cls,loadShifts:cls1.shifts.slice(0,15),allShifts:cls2.shifts})+'\n');
                // optional third column: a sketch script (mock/*.js) run on the live page before the pictures
                if (js) { await p.addScriptTag({content: fs.readFileSync(process.env.GITHUB_WORKSPACE + '/' + js, 'utf8')}); await p.waitForTimeout(2500);
                  for (let y=0;y<30000;y+=500){ await p.evaluate(v=>window.scrollTo(0,v),y); await p.waitForTimeout(80); } await p.evaluate(()=>window.scrollTo(0,0)); await p.waitForTimeout(1000);
                  const els = await p.$$('[data-shot]'); let i=0;
                  for (const e of els) { i++; try { await e.scrollIntoViewIfNeeded(); await p.waitForTimeout(800); const bb = await e.boundingBox(); if (!bb) continue;
                    const top = await p.evaluate(()=>window.scrollY);
                    await p.screenshot({path:`${process.env.OUT}/${name}-${tag}-part${i}.jpg`,type:'jpeg',quality:80,fullPage:true,clip:{x:0,y:Math.max(0,bb.y+top-260),width:vp.width,height:Math.min(bb.height+520,2600)}}); } catch(e) { console.log('part fail',name,tag,i,e.message); } } }
                await p.screenshot({path:`${process.env.OUT}/${name}-${tag}.jpg`,fullPage:true,type:'jpeg',quality:70});
                if (tag==='d') {
                  fs.writeFileSync(`${process.env.OUT}/${name}.html`, await p.content());
                  const css = await p.evaluate(()=>{ const out=[]; for (const s of document.styleSheets){ try{ for(const r of s.cssRules) out.push(r.cssText);}catch(e){} } return out.join('\n'); });
                  fs.writeFileSync(`${process.env.OUT}/${name}.css`, css);
                }
              } catch(e) { console.log('fail',name,tag,e.message); }
              await c.close();
            }
          }
          await b.close();
          JS
          OUT=$GITHUB_WORKSPACE/fetched/shots node shot.mjs $GITHUB_WORKSPACE/shots.txt >> $GITHUB_WORKSPACE/fetched/shots/log.txt 2>&1
          ls -la $GITHUB_WORKSPACE/fetched/shots
      - name: Lighthouse
        continue-on-error: true
        run: |
          [ -s lh.txt ] || exit 0
          mkdir -p fetched/lh
          while read -r name url preset; do [ -n "$url" ] || continue; P=""; [ "$preset" = "desktop" ] && P="--preset=desktop"
            for i in 1 2; do npx -y lighthouse@12 "$url" $P --only-categories=performance,accessibility --output=json --output-path=/tmp/lh-$name-$i.json --chrome-flags="--headless=new --no-sandbox" --quiet || true
              [ -f /tmp/lh-$name-$i.json ] && gzip -c /tmp/lh-$name-$i.json > fetched/lh/$name-$i.json.gz; done
          done < lh.txt
          ls -la fetched/lh
      - name: Commit
        if: always()
        run: |
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          git add fetched && git commit -qm "[fetched] $(date -u +%FT%TZ)" || { echo nothing; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase -q origin tools/fetch-media && git push -q origin HEAD:tools/fetch-media && break; sleep 7; done

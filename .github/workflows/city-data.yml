# city-data (29.10.2026): raw data for the nws.co.il city guide ("שימושון עירוני"): OpenStreetMap places inside Netanya and
# official data.gov.il datasets that mention Netanya. The workspace can't reach these hosts; the runner can. Output goes to the
# branch city-data (raw/*.json). Manual run only. Nothing here is published on the site directly.
name: city-data
on:
  workflow_dispatch:
    inputs:
      only:
        description: all, osm, gov or pages
        required: false
        default: all
      urls:
        description: for only=pages, official page addresses separated by |
        required: false
        default: ''
      gtfs:
        description: for only=pages, also read the Ministry of Transport GTFS (yes/no)
        required: false
        default: 'yes'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: fetch
        if: inputs.only != 'pages'
        run: node sites/nws/scripts/citydata-fetch.mjs out ${{ inputs.only || 'all' }}
      - name: official pages and GTFS
        if: inputs.only == 'pages'
        env:
          SKIP_GTFS: ${{ inputs.gtfs == 'no' && '1' || '' }}
          URLS: ${{ inputs.urls }}
        run: |
          cd sites/nws && npm i --no-save --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps chromium
          node scripts/citydata-pages.mjs ../../out "$URLS"
      - name: commit to city-data
        run: |
          git config user.name "city-data"; git config user.email "city-data@users.noreply.github.com"
          git fetch -q origin city-data && git checkout -q -B city-data origin/city-data || { git checkout --orphan city-data; git rm -rfq . >/dev/null; }
          mkdir -p raw && cp out/*.json raw/
          git add raw && git commit -qm "city data $(date -u +%F)" && git push origin city-data

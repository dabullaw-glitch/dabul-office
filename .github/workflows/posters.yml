name: video-posters
on:
  push:
    branches: [audit-run]
    paths: ['posters/**', '.github/workflows/posters.yml']
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q --no-deps spandrel
          pip install -q safetensors einops typing_extensions pillow numpy
          curl -sSL -o RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
      - name: Posters
        run: python posters/up.py ${{ matrix.shard }} 4
      - name: Commit
        if: always()
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add posters-out
          git commit -m "video posters ${{ matrix.shard }} $(date -u +%FT%TZ)" || echo nothing
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q origin audit-run && git push origin HEAD:audit-run && break; sleep $((RANDOM % 10 + 3)); done

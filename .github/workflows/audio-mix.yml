# audio-mix (28.10.2026): joins short voiced lines into one episode (the two-voice audio lessons of the online course).
# Each media/course-audio/<name>.txt lists the line mp3 urls in order (they live in the Supabase "pv" bucket, which the
# workspace cannot reach; the Actions runner can). Output: <name>.mp3 on the branch audio-out, with a short natural pause
# between lines and loudness evened out. Manual run only; pass the name, or "all".
name: audio-mix
on:
  workflow_dispatch:
    inputs:
      name:
        description: list name in media/course-audio (without .txt), or all
        required: true
        default: all
permissions:
  contents: write
jobs:
  mix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: mix
        run: |
          mkdir -p out
          for list in media/course-audio/*.txt; do
            name=$(basename "$list" .txt)
            if [ "${{ inputs.name }}" != "all" ] && [ "${{ inputs.name }}" != "$name" ]; then continue; fi
            rm -rf parts && mkdir parts && : > parts/list.txt
            ffmpeg -loglevel error -f lavfi -i anullsrc=r=24000:cl=mono -t 0.35 -c:a pcm_s16le parts/gap.wav
            i=0
            while read -r url; do
              [ -z "$url" ] && continue
              i=$((i+1)); n=$(printf %03d $i)
              curl -fsSL --retry 3 -o "parts/$n.mp3" "$url" || { echo "FAIL $url"; exit 1; }
              ffmpeg -loglevel error -i "parts/$n.mp3" -ar 24000 -ac 1 -c:a pcm_s16le "parts/$n.wav"
              echo "file '$n.wav'" >> parts/list.txt; echo "file 'gap.wav'" >> parts/list.txt
            done < "$list"
            ffmpeg -loglevel error -f concat -safe 0 -i parts/list.txt -af loudnorm=I=-16:TP=-1.5:LRA=11 -ar 44100 -ac 1 -b:a 96k "out/$name.mp3"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "out/$name.mp3" | xargs echo "$name seconds:"
          done
          ls -la out
      - name: commit to audio-out
        run: |
          git config user.name "audio-mix"; git config user.email "audio-mix@users.noreply.github.com"
          cp out/*.mp3 /tmp/
          if git ls-remote --exit-code --heads origin audio-out >/dev/null; then
            git fetch -q origin audio-out && git checkout -q -B audio-out origin/audio-out
          else
            git checkout -q --orphan audio-out && git rm -rfq . >/dev/null
          fi
          mkdir -p audio && cp /tmp/*.mp3 audio/
          git add audio && git commit -qm "audio $(date -u +%FT%H%M)" && git push -q origin audio-out

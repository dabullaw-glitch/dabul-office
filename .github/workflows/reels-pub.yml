name: reels pub
# reels-pub (5.11.2026): the publishing copies of the reels. The free Supabase plan has 1 GB of storage and the reels filled it
# (Yakir 5.11.2026: delete what was published, keep publishing what is scheduled, no paid plan). Since then a reel is published
# from a small copy on this GitHub Pages site, media/reels-pub/<name>.mp4, whose link is kept in "videoUrl" on the reel row and
# on its pub rows (fn/_shared/video-src.js). Nothing is published from here.
# Input: media/reels-pub/drive.txt, one "<name> <Google Drive file id>" per line (the edited reels in Drive, shared by link).
# For each name without media/reels-pub/<name>.mp4: download, re-encode for phones (H.264 CRF 27, AAC 128k, +faststart; the
# original is kept as it is when re-encoding saves less than 20%), and commit <name>.mp4, <name>.src.json (source bytes,
# duration, size and the storage-style eTag in 16 MiB parts, to compare with a copy in storage) and three check stills
# media/reels-pub/check/<name>-1..3.jpg. A failure writes <name>.error.txt.
on:
  push:
    branches: [main]
    paths: ['media/reels-pub/drive.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: reels-pub, cancel-in-progress: false }
jobs:
  pub:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
      - name: Download and compress
        run: |
          set -u
          mkdir -p media/reels-pub/check /tmp/rp
          cat > /tmp/rp/etag.py <<'PY'
          import hashlib, sys
          ds = []
          with open(sys.argv[1], 'rb') as f:
              while True:
                  b = f.read(16 * 1024 * 1024)
                  if not b: break
                  ds.append(hashlib.md5(b).digest())
          print(ds[0].hex() if len(ds) == 1 else hashlib.md5(b''.join(ds)).hexdigest() + '-%d' % len(ds))
          PY
          while read -r name id; do
            [ -z "${name:-}" ] && continue
            case "$name" in \#*) continue;; esac
            echo "$name" | grep -Eq '^[A-Za-z0-9_-]+$' || { echo "bad name $name"; continue; }
            echo "$id" | grep -Eq '^[A-Za-z0-9_-]+$' || { echo "bad id $id"; continue; }
            out="media/reels-pub/$name.mp4"
            [ -f "$out" ] && continue
            src="/tmp/rp/$name.src"
            if ! curl -fsSL --retry 3 -o "$src" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"; then
              echo "download failed $(date -u +%FT%TZ)" > "media/reels-pub/$name.error.txt"; echo "FAIL $name"; continue; fi
            if ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$src" | grep -q video; then
              { echo "not a video $(date -u +%FT%TZ)"; file "$src"; head -c 300 "$src"; } > "media/reels-pub/$name.error.txt"; echo "FAIL $name (not a video)"; continue; fi
            sb=$(stat -c %s "$src")
            ffmpeg -nostdin -y -v error -i "$src" -map 0:v:0 -map '0:a:0?' -c:v libx264 -preset medium -crf 27 -profile:v high -level 4.1 \
              -pix_fmt yuv420p -r 30 -c:a aac -b:a 128k -ar 48000 -movflags +faststart "/tmp/rp/$name.mp4"
            ob=$(stat -c %s "/tmp/rp/$name.mp4")
            if [ "$ob" -ge $(( sb * 8 / 10 )) ]; then
              ffmpeg -nostdin -y -v error -i "$src" -map 0 -c copy -movflags +faststart "/tmp/rp/$name.mp4"; mode=original
            else mode=compressed; fi
            mv "/tmp/rp/$name.mp4" "$out"
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$out")
            wh=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$out")
            printf '{"name":"%s","driveId":"%s","srcBytes":%s,"srcEtag16MiB":"%s","bytes":%s,"mode":"%s","duration":%s,"size":"%s","at":"%s"}\n' \
              "$name" "$id" "$sb" "$(python3 /tmp/rp/etag.py "$src")" "$(stat -c %s "$out")" "$mode" "$dur" "$wh" "$(date -u +%FT%TZ)" > "media/reels-pub/$name.src.json"
            i=1; for p in 0.1 0.5 0.9; do
              t=$(python3 -c "print(round($dur*$p,2))")
              ffmpeg -nostdin -y -v error -ss "$t" -i "$out" -frames:v 1 -vf scale=300:-1 -q:v 5 "media/reels-pub/check/$name-$i.jpg"; i=$((i+1))
            done
            rm -f "$src" "media/reels-pub/$name.error.txt"
            echo "done $name $mode $sb -> $(stat -c %s "$out")"
          done < media/reels-pub/drive.txt
      - name: Commit (GitHub Pages, not to any network)
        if: always()
        run: |
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          git add media/reels-pub
          git commit -qm "reels-pub: publishing copies" || { echo nothing; exit 0; }
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep 5; done; exit 1

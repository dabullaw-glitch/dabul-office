name: nws site
# Builds the news site "חדשות נתניה והשרון" (sites/nws) for https://nws.co.il and publishes the built files to the
# nws-site branch, which Cloudflare Pages serves as is (no build there).
# Before each build, scripts/feed.mjs fetches the stories the news engine published (Supabase function hns-feed),
# so the schedule below brings new published stories to the site within about 15 minutes.
# scripts/biz.mjs does the same for the approved business directory listings (Supabase function hns-biz).
on:
  schedule: [{ cron: '*/15 * * * *' }]
  push:
    branches: [main]
    paths: ['sites/nws/**', '.github/workflows/nws.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: nws, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: sites/nws/package-lock.json }
      - name: Install
        working-directory: sites/nws
        run: npm ci --no-audit --no-fund
      - name: Build (fetches the published stories first)
        working-directory: sites/nws
        run: npm run build
      - name: Check the build
        working-directory: sites/nws/dist
        run: |
          test -f index.html
          grep -q 'Allow: /' robots.txt
          if grep -q 'Disallow: /$' robots.txt; then echo "robots.txt blocks the site"; exit 1; fi
          if grep -q 'name="robots" content="noindex' index.html; then echo "home page is noindex"; exit 1; fi
          grep -q 'https://nws.co.il/' sitemap.xml
      # Every push to nws-site is a new Cloudflare Pages deployment, so a scheduled run publishes only when something changed:
      # the published stories or directory listings, the site source, or the Israel date (daily pages such as Shabbat times and past events).
      - name: Decide whether to publish
        id: key
        run: |
          STORIES=$(node -e "const j=require('./sites/nws/src/data/feed.json');let b={};try{b=require('./sites/nws/src/data/biz.json')}catch(e){};process.stdout.write(JSON.stringify([j.stories||[],b.listings||[]]))" | sha256sum | cut -c1-16)
          SRC=$(git rev-parse HEAD:sites/nws | cut -c1-16)
          DAY=$(TZ=Asia/Jerusalem date +%F)
          KEY="$STORIES-$SRC-$DAY"
          echo "$KEY" > sites/nws/dist/.build-key
          OLD=$(git fetch -q --depth=1 origin nws-site 2>/dev/null && git show FETCH_HEAD:.build-key 2>/dev/null || true)
          echo "key=$KEY old=$OLD"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$KEY" = "$OLD" ]; then echo "publish=no" >> "$GITHUB_OUTPUT"; else echo "publish=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Publish to nws-site branch
        if: steps.key.outputs.publish == 'yes'
        run: |
          D=$(mktemp -d); cp -r sites/nws/dist/. "$D"/
          cd "$D"; git init -q; git checkout -qb nws-site
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          git add -A; git commit -qm "nws.co.il $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" nws-site

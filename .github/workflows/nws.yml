name: nws site
# Builds the news site "חדשות נתניה והשרון" (sites/nws) for https://nws.co.il and publishes the built files to the
# nws-site branch, which Cloudflare Pages serves as is (no build there).
# Before each build, scripts/feed.mjs fetches what the news engine published (Supabase function hns-feed: stories, official flashes,
# events calendar) and scripts/biz.mjs the approved business directory listings (hns-biz).
# 28.10.2026: scripts/live.mjs saves a sea and weather snapshot (Open-Meteo), and scripts/img.mjs turns the AI illustrations of the
# stories into small WebP files; those files are kept in the Actions cache (.imgcache), so each image is downloaded only once.
# 28.10.2026 (Yakir: new stories on the site within minutes, all day): GitHub's schedule alone was not reliable, so one run now
# stays up for about 55 minutes (scripts/loop.sh): it checks the engine every ~45 seconds and builds and publishes only when
# something changed. At the end it starts the next run itself (workflow_dispatch with the workflow token, which GitHub allows).
# The schedule below only restarts the chain if it ever stops. A push to main cancels the running loop and starts one with the
# new code; a scheduled or dispatched run waits for the running one instead of cancelling it.
on:
  schedule: [{ cron: '4,34 * * * *' }]
  push:
    branches: [main]
    paths: ['sites/nws/**', '.github/workflows/nws.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nws
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: sites/nws/package-lock.json }
      - name: Install
        working-directory: sites/nws
        run: npm ci --no-audit --no-fund
      - name: Restore the AI image cache
        uses: actions/cache/restore@v4
        with:
          path: sites/nws/.imgcache
          key: nwsimg-${{ github.run_id }}
          restore-keys: nwsimg-
      - name: Build and publish whenever the engine has something new (about 55 minutes)
        working-directory: sites/nws
        env:
          GH_TOKEN: ${{ github.token }}
          LOOP_MIN: ${{ github.event_name == 'push' && '50' || '55' }}
        run: bash scripts/loop.sh
      - name: Save the AI image cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sites/nws/.imgcache
          key: nwsimg-${{ github.run_id }}
      - name: Start the next round
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nws.yml --ref main -R "$GITHUB_REPOSITORY"

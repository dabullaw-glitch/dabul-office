name: youtube text (internal)
# Gets the spoken text of the office's own YouTube videos, for the video watch pages on dabullaw.co.il (Yakir 15.10.2026).
# yt-text.txt lines: "<name> <Google Drive file id>" (the edited video file in the office Drive; YouTube itself blocks
# downloads from GitHub). Downloads it, keeps the audio only and transcribes it (faster-whisper, ivrit-ai model).
# Output: fetched/yt-text/<name>.txt (plain text, one sentence per line).
# Nothing is published (this branch is internal).
on:
  push:
    branches: [tools/fetch-media]
    paths: [yt-text.txt]
permissions:
  contents: write
concurrency: { group: yt-text, cancel-in-progress: false }
jobs:
  text:
    if: "!contains(github.event.head_commit.message, '[yt-text]')"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
          pip install -q faster-whisper==1.1.1 scipy numpy
      - name: Text
        run: |
          mkdir -p fetched/yt-text; exec > >(tee -a fetched/yt-text/_log.txt) 2>&1
          cat > /tmp/tr.py <<'PY'
          import sys, json
          import numpy as np
          from scipy.io import wavfile
          from faster_whisper import WhisperModel
          m = None
          for name in ("ivrit-ai/whisper-large-v3-turbo-ct2", "large-v3-turbo"):
              try:
                  m = WhisperModel(name, device="cpu", compute_type="int8"); print("model", name); break
              except Exception as e:
                  print("model failed", name, e)
          sr, a = wavfile.read(sys.argv[1])
          audio = (a.astype(np.float32) / 32768.0) if a.dtype == np.int16 else a.astype(np.float32)
          segs, info = m.transcribe(audio, language="he", beam_size=5)
          open(sys.argv[2], "w", encoding="utf-8").write("\n".join(s.text.strip() for s in segs))
          PY
          while read -r id drive; do
            case "$id" in \#*|"") continue;; esac; [ -n "$drive" ] || continue
            out=fetched/yt-text/$id; [ -s "$out.txt" ] && { echo "skip $id"; continue; }
            mkdir -p /tmp/a
            curl -fsSL --retry 3 "https://drive.usercontent.google.com/download?id=$drive&export=download&confirm=t" -o /tmp/a/$id.src < /dev/null || { echo "download fail $id"; continue; }
            if head -c 300 /tmp/a/$id.src | grep -qi '<html\|<!doctype'; then
              echo "drive page for $id: $(grep -o '<title>[^<]*' /tmp/a/$id.src | head -1) $(grep -o 'uc-error-subcaption[^<]*<[^<]*' /tmp/a/$id.src | head -1)"
              uuid=$(grep -o 'name="uuid" value="[^"]*"' /tmp/a/$id.src | head -1 | cut -d'"' -f4)
              at=$(grep -o 'name="at" value="[^"]*"' /tmp/a/$id.src | head -1 | cut -d'"' -f4)
              curl -fsSL --retry 3 "https://drive.usercontent.google.com/download?id=$drive&export=download&confirm=t&uuid=$uuid&at=$at" -o /tmp/a/$id.src < /dev/null || { echo "download fail 2 $id"; continue; }
              head -c 300 /tmp/a/$id.src | grep -qi '<html\|<!doctype' && { echo "still a page $id"; continue; }
            fi
            ls -la /tmp/a/$id.src
            ffmpeg -nostdin -y -v error -i /tmp/a/$id.src -vn -ac 1 -ar 16000 /tmp/a/$id.wav && python3 /tmp/tr.py /tmp/a/$id.wav "$out.txt" < /dev/null && echo "ok $id" || echo "fail $id"
            ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/a/$id.src > "$out.dur" 2>/dev/null || true
            rm -f /tmp/a/$id.*
            git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
            git add fetched/yt-text; git commit -qm "[yt-text] $id" || true
            for i in 1 2 3 4 5; do git pull --rebase -q origin tools/fetch-media < /dev/null && git push -q origin HEAD:tools/fetch-media < /dev/null && break; sleep 6; done
          done < yt-text.txt

name: carousel probe
# Measures how fast the pictures of the home page carousel appear for a visitor who scrolls to it (phone + computer).
on:
  workflow_dispatch:
    inputs:
      url: { description: 'page address', required: true, default: 'https://dabullaw.co.il/' }
      name: { description: 'result folder', required: true, default: 'carousel' }
permissions:
  contents: write
concurrency: { group: visual, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Probe
        run: |
          cd tools/office-video && npm install --no-audit --no-fund && npx playwright install --with-deps chromium && cd ../..
          cp tools/visual/carousel.mjs tools/office-video/carousel.mjs
          node tools/office-video/carousel.mjs "${{ inputs.url }}" "${{ inputs.name }}" 2>&1 | tee /tmp/c.log || true
          mkdir -p tools/visual/${{ inputs.name }}; cp /tmp/c.log tools/visual/${{ inputs.name }}/log.txt
          rm tools/office-video/carousel.mjs
          sudo apt-get install -yq imagemagick >/dev/null 2>&1 || true
          for f in tools/visual/${{ inputs.name }}/*.png; do mogrify -resize '50%' -quality 80 "$f" || true; done
      - name: Save
        run: |
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          git add tools/visual
          git commit -qm "carousel probe: ${{ inputs.name }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 6; done

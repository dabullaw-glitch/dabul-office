name: reel chunks (internal)
# Transcribes an already prepared take piece by piece (split at short pauses) to find retakes and stumbles.
# Trigger: push to tools/reel-lab changing chunks.txt (lines: "<name>"). Output: reel-lab/<name>/chunks.json
on:
  push:
    branches: [tools/reel-lab]
    paths: [chunks.txt]
permissions:
  contents: write
concurrency: { group: reel-lab, cancel-in-progress: false }
jobs:
  chunks:
    if: "!contains(github.event.head_commit.message, '[reel-lab]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
          pip install -q faster-whisper==1.1.1 scipy numpy
      - name: Chunks
        run: |
          set -e
          while read -r name; do
            case "$name" in \#*|"") continue;; esac
            out="reel-lab/$name"; [ -f "$out/chunks.json" ] && continue
            ffmpeg -y -v error -i "$out/proxy.mp4" -vn -ac 1 -ar 16000 /tmp/$name.wav
            python3 tools/reel-lab/chunks.py "$out" /tmp/$name.wav
          done < chunks.txt
      - name: Commit
        run: |
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          git add reel-lab
          git commit -qm "[reel-lab] chunks" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin tools/reel-lab && git push origin HEAD:tools/reel-lab && break; sleep 6; done

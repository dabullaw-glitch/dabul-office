# probe (28.10.2026): opens a public page in a real browser on the runner and records its fonts and screenshots
# (the workspace can't reach most sites). Results go to the branch probe-out. Manual run only.
name: probe
on:
  workflow_dispatch:
    inputs:
      url: { description: 'page url', required: true }
      name: { description: 'short name', required: true }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/p && cp tools/probe/probe.mjs /tmp/p/ && cd /tmp/p && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node probe.mjs "${{ inputs.url }}" "${{ inputs.name }}" || true
          ls -la out
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git fetch origin probe-out || true
          git checkout -B probe-out origin/probe-out 2>/dev/null || git checkout --orphan probe-out
          git rm -rfq . >/dev/null 2>&1 || true
          mkdir -p out && cp /tmp/p/out/* out/ && git add out && git commit -qm "probe ${{ inputs.name }}" && git push -f origin probe-out

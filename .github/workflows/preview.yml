name: page-preview
on:
  push:
    branches: [audit-run]
    paths: ['preview/**', '.github/workflows/preview.yml']
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          npm init -y >/dev/null
          npm i playwright@1.47.2 sharp@0.33.5
          npx playwright install --with-deps chromium
      - name: Build preview
        run: |
          node preview/run.mjs
          if [ -f preview/live-url.txt ]; then node preview/live.mjs; fi
          if [ -f preview/verify.mjs ]; then node preview/verify.mjs; fi
      - name: Commit
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add preview-results
          git commit -m "preview results $(date -u +%FT%TZ)" || echo nothing
          git push origin HEAD:audit-run

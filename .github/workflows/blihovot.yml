name: bli-hovot site
# Builds the "בלי חובות" information site (sites/blihovot) and publishes the result to the bli-hovot/ folder,
# which GitHub Pages serves at https://dabullaw-glitch.github.io/dabul-office/bli-hovot/ (hidden from search engines),
# and a production build for https://blihovot.co.il to the blihovot-site branch, which Cloudflare Pages serves as is (no build there).
# Runs nightly too, so new forum questions get their own indexable pages.
on:
  schedule: [{ cron: '17 0 * * *' }]
  push:
    branches: [main]
    paths: ['sites/blihovot/**', '.github/workflows/blihovot.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: blihovot, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install
        working-directory: sites/blihovot
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build
        working-directory: sites/blihovot
        run: npm run build
      - name: Publish to bli-hovot/
        run: |
          rm -rf bli-hovot && cp -r sites/blihovot/dist bli-hovot && touch bli-hovot/.nojekyll
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          git add -A bli-hovot
          git commit -qm "bli-hovot: publish $(date -u +%FT%TZ)" || { echo nothing; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 6; done
      - name: Production build (blihovot.co.il)
        working-directory: sites/blihovot
        env: { SITE_URL: 'https://blihovot.co.il', BASE: '/', PREVIEW: '0' }
        run: rm -rf dist && npm run build
      - name: Publish to blihovot-site branch
        run: |
          D=$(mktemp -d); cp -r sites/blihovot/dist/. "$D"/
          cd "$D"; git init -q; git checkout -qb blihovot-site
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          git add -A; git commit -qm "blihovot.co.il $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" blihovot-site

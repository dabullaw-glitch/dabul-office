name: site audit (read only)
# Crawls dabullaw.co.il slowly (sitemap pages + their internal links, redirects not followed) and saves
# tools/site-audit/out/report.json + summary.txt on branch tools/site-audit. Changes nothing on the site.
on:
  push:
    branches: [tools/site-audit]
    paths: [tools/site-audit/run.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: site-audit, cancel-in-progress: false }
jobs:
  crawl:
    if: "!contains(github.event.head_commit.message, '[site-audit]')"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Crawl
        run: python3 tools/site-audit/crawl.py 2>&1 | tail -n 400 > tools/site-audit/log.txt; tail -5 tools/site-audit/log.txt
      - name: Save
        if: always()
        run: |
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          git add tools/site-audit
          git commit -qm "[site-audit] results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin tools/site-audit && git push origin HEAD:tools/site-audit && break; sleep 6; done

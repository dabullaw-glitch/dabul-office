name: course move to private storage (one-off)
# 25.11.2026 (Yakir approved): the paid lessons of the course "קונים דירה ראשונה, בלי הפתעות" (lessons 2 to 7) leave the public
# repo. This run takes each listed lesson video from the checkout, makes it smaller for the free storage plan (x264 crf 28,
# mono speech audio 64 kbps; checked on still frames: the same look) and uploads it with its poster into the PRIVATE bucket
# 'course' through signed upload links from the academy function (OIDC, audience 'dabul-course', docs coursejob/<id> with
# kind 'move' and status 'queued'). Nothing from the lessons is printed. Manual run only; delete this file when done.
on:
  workflow_dispatch:
    inputs:
      ids: { description: 'file ids, space separated (media/course/first-home/<id>.mp4)', required: true }
permissions:
  contents: read
  id-token: write
concurrency: { group: course-move, cancel-in-progress: false }
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "media/course/first-home", sparse-checkout-cone-mode: true }
      - name: Tools
        run: command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
      - name: Re-encode and upload privately
        env: { IDS: '${{ inputs.ids }}' }
        run: |
          set -uo pipefail
          F=https://mgjmnvpnovkewvqevjmz.supabase.co/functions/v1/academy
          tok() { curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dabul-course" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])"; }
          fail=0
          for id in $IDS; do
            [[ "$id" =~ ^fh-l(0[2-9]|10)-[a-z0-9-]+$ ]] || { echo "skip $id (not a paid lesson id)"; continue; }
            src="media/course/first-home/$id.mp4"; [ -f "$src" ] || { echo "missing $id"; fail=1; continue; }
            W=$(mktemp -d)
            ffmpeg -nostdin -y -v error -i "$src" -c:v libx264 -preset slow -tune stillimage -crf 28 -pix_fmt yuv420p -profile:v high \
              -c:a aac -b:a 64k -ac 1 -ar 44100 -movflags +faststart "$W/v.mp4" || { echo "encode failed $id"; fail=1; continue; }
            in=$(stat -c %s "$src"); out=$(stat -c %s "$W/v.mp4")
            d=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$W/v.mp4")
            T=$(tok); echo "::add-mask::$T"
            code=$(curl -s -o "$W/job.json" -w '%{http_code}' -H "Authorization: Bearer $T" "$F?gh=job&id=$id")
            [ "$code" = 200 ] || { echo "job answer $code for $id"; fail=1; rm -rf "$W"; continue; }
            up() { python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['up'][sys.argv[2]])" "$W/job.json" "$1"; }
            c1=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: video/mp4' -H 'x-upsert: true' --data-binary @"$W/v.mp4" "$(up mp4)")
            c2=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: image/jpeg' -H 'x-upsert: true' --data-binary @"media/course/first-home/$id.jpg" "$(up jpg)")
            ok=false; [ "$c1" = 200 ] && [ "$c2" = 200 ] && ok=true
            echo "$id: $in -> $out bytes, ${d}s, upload $c1/$c2"
            T=$(tok); echo "::add-mask::$T"
            printf '{"id":"%s","ok":%s,"result":{"bytesBefore":%s,"bytes":%s,"duration":%s,"settings":"x264 slow stillimage crf 28, aac 64k mono"},"error":"upload %s/%s"}' "$id" "$ok" "$in" "$out" "$d" "$c1" "$c2" > "$W/done.json"
            curl -s -o /dev/null -w "done answer %{http_code}\n" -X POST -H "Authorization: Bearer $T" -H 'content-type: application/json' --data @"$W/done.json" "$F?gh=done"
            [ "$ok" = true ] || fail=1
            rm -rf "$W"
          done
          exit $fail

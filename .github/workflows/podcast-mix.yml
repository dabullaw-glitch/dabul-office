name: podcast mix
# Podcast "נדל״ן בגובה העיניים" (TASK.md 6b, pipeline.3_mix + 5_youtube_video). Built 5.11.2026 in the pattern of audio-mix.yml.
# Input: media/podcast/src/<epNN>.json pushed to main by the scheduled task "סרטוני הייגן" after the voice was made in
# HeyGen (the runner downloads the HeyGen audio links; the task's sandbox cannot). The covers (media/podcast/<epNN>.jpg,
# <epNN>-ytbg.png) are rendered and committed by the task before the job (tools/podcast/covers.py).
# Output (main, GitHub Pages): media/podcast/<epNN>.mp3, <epNN>.mp4 (regular YouTube video: cover + sound wave),
# <epNN>.json (duration, loudness, chapters), check stills <epNN>-check-1..3.jpg. On failure: <epNN>.error.txt.
# Nothing is published from here: Yakir approves the finished episode first.
on:
  push:
    branches: [main]
    paths: ['media/podcast/src/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: podcast-mix, cancel-in-progress: false }
jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        # full history: the skip test below compares the commit times of the job and the mp3 (a shallow clone makes them equal)
        with: { fetch-depth: 0 }
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: mix
        id: mix
        run: |
          done=""
          for f in media/podcast/src/*.json; do
            [ -f "$f" ] || continue
            ep=$(basename "$f" .json)
            echo "$ep" | grep -Eq '^ep[0-9]+(-[0-9]+)?$' || continue
            [ -f "media/podcast/$ep.mp3" ] && [ "$(git log -1 --format=%ct -- "$f")" -le "$(git log -1 --format=%ct -- "media/podcast/$ep.mp3")" ] && continue
            if [ -f "media/podcast/$ep.error.txt" ] && [ "$(git log -1 --format=%ct -- "$f")" -le "$(git log -1 --format=%ct -- "media/podcast/$ep.error.txt")" ]; then continue; fi
            if python3 tools/podcast/mix.py "$f" > "/tmp/$ep.log" 2>&1; then rm -f "media/podcast/$ep.error.txt"; else tail -40 "/tmp/$ep.log" > "media/podcast/$ep.error.txt"; fi
            cat "/tmp/$ep.log" | tail -5
            done="$done $ep"
          done
          echo "done=$(echo $done)" >> "$GITHUB_OUTPUT"
      - name: commit
        if: steps.mix.outputs.done != ''
        run: |
          git config user.name "podcast-mix"; git config user.email "podcast-mix@users.noreply.github.com"
          git add media/podcast
          git commit -qm "podcast mix: ${{ steps.mix.outputs.done }}" || { echo nothing; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 6; done

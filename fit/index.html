<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitTrack</title>
<meta name="theme-color" content="#0d1117">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0b0f14;--card:#141b24;--card2:#1a2330;--line:#243041;--tx:#e8eef5;--mut:#8b9bb0;--acc:#22c55e;--acc2:#16a34a;--warn:#f59e0b;--bad:#ef4444;--blue:#38bdf8;--r:18px;
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Heebo","Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px}
body{padding:calc(var(--safe-t) + 10px) 14px calc(var(--safe-b) + 92px);max-width:620px;margin:0 auto;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:4px 0 2px;font-weight:800;letter-spacing:.2px}
h2{font-size:17px;margin:0 0 10px;font-weight:700}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.stat .k{color:var(--mut);font-size:13px}
.stat .v{font-size:26px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--mut);font-weight:500;margin-inline-start:4px}
.stat .d{font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.up{color:var(--warn)}.down{color:var(--acc)}.flat{color:var(--mut)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 16px;font-weight:800;font-size:17px;background:var(--acc);color:#04130a;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line);font-weight:700}
.btn.small{padding:10px 12px;font-size:15px;width:auto}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #4a2326}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.between{justify-content:space-between}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.pill.g{color:var(--acc);border-color:#1f4d33;background:#0f2418}
.pill.o{color:var(--warn);border-color:#4d3a12;background:#241b0a}
.pill.r{color:var(--bad);border-color:#4a2326;background:#240f10}
.pill.b{color:var(--blue);border-color:#17405a;background:#0b1e2a}
.next{background:linear-gradient(150deg,#12321f,#0f1a24 70%);border-color:#1f4d33}
.next .t{font-size:24px;font-weight:800;margin:6px 0 2px}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.o>i{background:var(--warn)}
.tip{background:#0e1b26;border:1px solid #17405a;border-radius:16px;padding:14px;line-height:1.6;font-size:15px}
.tip b{color:var(--blue)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,15,20,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(var(--safe-b) + 8px);z-index:20}
nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;padding:4px 6px;min-width:54px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}
label.f{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
input.in,select.in,textarea.in{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px;outline:none}
input.in:focus,textarea.in:focus,select.in:focus{border-color:var(--acc)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{border:1px solid var(--line);border-radius:16px;margin:0 0 10px;background:var(--card);overflow:hidden}
.exh{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer}
.exh .nm{font-weight:700;font-size:16px}
.exh .mt{color:var(--mut);font-size:13px;margin-top:2px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.chk.on{background:var(--acc);border-color:var(--acc);color:#04130a}
.sets{padding:0 12px 12px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;align-items:center;margin:0 0 8px}
.set .n{color:var(--mut);text-align:center;font-weight:700}
.stp{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stp button{width:38px;height:46px;border:0;background:transparent;font-size:22px;color:var(--mut);cursor:pointer;flex:none}
.stp input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-size:19px;font-weight:700;height:46px;outline:none;font-variant-numeric:tabular-nums}
.stp .u{font-size:11px;color:var(--mut);position:relative}
.sdone{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}
.sdone.on{background:var(--acc);border-color:var(--acc);color:#04130a}
.hd{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;color:var(--mut);font-size:12px;margin:0 0 6px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dn{color:var(--mut);font-size:12px;text-align:center}
.cal .c{aspect-ratio:1/1;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;position:relative;cursor:pointer;min-width:0}
.cal .c b{font-size:15px;font-weight:700}
.cal .c i{font-style:normal;font-size:11px;font-weight:800;margin-top:1px}
.cal .c.done{background:#0f2418;border-color:#1f4d33}.cal .c.done i{color:var(--acc)}
.cal .c.plan{border-color:#17405a}.cal .c.plan i{color:var(--blue)}
.cal .c.miss{background:#240f10;border-color:#4a2326}.cal .c.miss i{color:var(--bad)}
.cal .c.post{background:#241b0a;border-color:#4d3a12}.cal .c.post i{color:var(--warn)}
.cal .c.skip i{color:var(--mut)}
.cal .c.today{outline:2px solid var(--acc);outline-offset:1px}
.cal .c.out{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chart{width:100%;height:auto;display:block}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;color:var(--mut);font-weight:700;cursor:pointer;font-size:14px}
.seg button.on{background:var(--acc);color:#04130a}
.msg{padding:12px 14px;border-radius:16px;margin:0 0 10px;line-height:1.6;white-space:pre-wrap;font-size:15px;max-width:92%}
.msg.u{background:#12321f;margin-inline-start:auto;border:1px solid #1f4d33}
.msg.a{background:var(--card);border:1px solid var(--line)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.list li:last-child{border:0}
.list li span:last-child{color:var(--mut);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 90px);background:#1f2937;border:1px solid var(--line);padding:11px 16px;border-radius:12px;z-index:40;font-size:15px;max-width:90vw;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(var(--safe-b) + 18px);width:100%;max-width:620px;max-height:88vh;overflow:auto}
.sync{font-size:12px;color:var(--mut)}
.sync.off{color:var(--warn)}
.ph{width:72px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.muted{color:var(--mut)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.center{text-align:center}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.pin{letter-spacing:10px;text-align:center;font-size:28px !important}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--acc)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden>
  <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>ראשי</button>
  <button data-go="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>אימונים</button>
  <button data-go="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>לוח</button>
  <button data-go="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M7 20V10m5 10V4m5 16v-7"/></svg>מדדים</button>
  <button data-go="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.6L18 9.4l-4.2 1.8L12 16l-1.8-4.8L6 9.4l4.2-1.8z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>מאמן</button>
  <button data-go="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>עוד</button>
</nav>
<script>
"use strict";
// ---------- server (office database, personal functions only) ----------
const API = 'https://mgjmnvpnovkewvqevjmz.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_VlbYeA-oSqVs28QSWXtwJA_VoMt8p6j';
async function rpc(fn, args) {
  const r = await fetch(API + fn, { method: 'POST', headers: { apikey: KEY, 'content-type': 'application/json' }, body: JSON.stringify(args) });
  if (!r.ok) throw new Error('net ' + r.status);
  return r.json();
}
const LS = { get(k, d) { try { const v = localStorage.getItem('ft_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ft_' + k, JSON.stringify(v)); } catch (e) {} } };

// ---------- dates ----------
const DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const DSHORT = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
const MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const dow = s => parse(s).getDay();
const fmtD = s => { const d = parse(s); return d.getDate() + '.' + (d.getMonth() + 1); };
const weekStart = s => addDays(s, -dow(s));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, d = 1) => (v == null || v === '' || isNaN(v)) ? '' : (+(+v).toFixed(d)).toString();

// ---------- default data (from Yakir's brief) ----------
function ex(name, muscle, sets, reps, unit) { return { id: uid(), name, muscle, sets, reps, unit: unit || 'ק"ג', note: '' }; }
function defaults() {
  return {
    v: 1, start: today(),
    profile: { age: 30, height: 173, goal: 'בניית מסת שריר והפחתת אחוזי שומן', freq: 3, type: 'חדר כושר, מכשירים ומשקולות', activity: 'עבודה משרדית וישיבה ממושכת', stepsBase: 3607 },
    targets: { kcal: 2150, protein: 145, carbs: 230, fat: 70, water: 3, steps: 7000 },
    days: [0, 2, 4],
    plan: {
      A: { name: 'פלג גוף עליון א', focus: 'חזה · גב · כתפיים · יד אחורית', ex: [
        ex('לחיצת חזה במכונה', 'חזה', 3, '8-10'), ex('לחיצת חזה בשיפוע עליון עם משקולות', 'חזה', 3, '10-12'),
        ex('פולי עליון', 'גב', 3, '10-12'), ex('חתירה בכבל בישיבה', 'גב', 3, '10-12'),
        ex('לחיצת כתפיים במכונה', 'כתפיים', 3, '10-12'), ex('הרחקה לצדדים עם משקולות', 'כתפיים', 3, '12-15'),
        ex('פשיטת מרפקים בכבל', 'יד אחורית', 3, '12-15')] },
      B: { name: 'רגליים וידיים ב', focus: 'רגליים · יד קדמית · יד אחורית · בטן', ex: [
        ex('לחיצת רגליים', 'רגליים', 4, '10-12'), ex('כפיפת ברכיים במכונה', 'רגליים', 3, '10-12'),
        ex('פשיטת ברכיים במכונה', 'רגליים', 3, '12-15'), ex('הרמת עקבים (תאומים)', 'רגליים', 3, '12-15'),
        ex('כפיפת מרפקים עם משקולות', 'יד קדמית', 3, '10-12'), ex('פשיטת מרפקים מעל הראש', 'יד אחורית', 3, '10-12'),
        ex('כפיפות בטן בכבל', 'בטן', 3, '12-15'), ex('פלאנק', 'בטן', 3, '30-45', 'שניות')] },
      C: { name: 'פלג גוף עליון ג', focus: 'גב · חזה · כתפיים · יד קדמית · יד אחורית', ex: [
        ex('חתירה עם משקולת ביד אחת', 'גב', 3, '8-10'), ex('פולי עליון באחיזה צרה', 'גב', 3, '10-12'),
        ex('לחיצת חזה בשיפוע במכונה', 'חזה', 3, '10-12'), ex('פרפר במכונה', 'חזה', 3, '12-15'),
        ex('פרפר הפוך לכתף אחורית', 'כתפיים', 3, '12-15'), ex('לחיצת כתפיים עם משקולות', 'כתפיים', 3, '8-10'),
        ex('כפיפת מרפקים בפטיש', 'יד קדמית', 3, '10-12'), ex('מקבילים במכונה', 'יד אחורית', 3, '8-12')] }
    },
    sessions: [], postponed: {}, extra: {},
    body: [{ date: today(), weight: 75.8, waist: 86 }],
    food: {},
    ai: { tip: '', tipDate: '', chat: [] },
    settings: { tg: true },
    updatedAt: Date.now()
  };
}

// ---------- state + sync ----------
let D = LS.get('data', null), TOKEN = LS.get('token', ''), dirty = LS.get('dirty', false), online = navigator.onLine, saving = false, lastSync = LS.get('lastSync', 0);
let view = 'home', sub = {};
function save(now) {
  D.updatedAt = Date.now(); LS.set('data', D); dirty = true; LS.set('dirty', true);
  clearTimeout(save.t); save.t = setTimeout(push, now ? 0 : 1200); syncBadge();
}
async function push() {
  if (!TOKEN || !dirty || saving) return;
  saving = true;
  try {
    const r = await rpc('fit_save', { p_token: TOKEN, p_data: D });
    if (r && r.ok) { dirty = false; LS.set('dirty', false); lastSync = Date.now(); LS.set('lastSync', lastSync); online = true; }
    else if (r && r.error === 'auth') { logout(); }
  } catch (e) { online = false; }
  saving = false; syncBadge();
}
async function pull() {
  try {
    const r = await rpc('fit_load', { p_token: TOKEN });
    if (!r.ok) { if (r.error === 'auth') logout(); return; }
    online = true;
    const srv = r.data || {};
    if (!srv.v) { if (!D) D = defaults(); save(true); await pullSteps(); return; }
    if (!D || (!dirty && (srv.updatedAt || 0) >= (D.updatedAt || 0)) || (srv.updatedAt || 0) > (D.updatedAt || 0)) { D = srv; LS.set('data', D); dirty = false; LS.set('dirty', false); }
    else if (dirty) push();
    lastSync = Date.now(); LS.set('lastSync', lastSync);
    await pullSteps();
  } catch (e) { online = false; }
  syncBadge(); render();
}
let HEALTH = LS.get('health', { linked: false, last: null });
async function pullSteps() {
  try {
    const r = await rpc('fit_steps_get', { p_token: TOKEN }); if (!r.ok || !D) return;
    HEALTH = { linked: !!r.linked, last: r.last }; LS.set('health', HEALTH);
    let ch = false;
    Object.entries(r.steps || {}).forEach(([d, v]) => { const f = foodDay(d); if (+f.steps !== +v) { f.steps = +v; ch = true; } });
    if (ch) save();
  } catch (e) {}
}
function syncBadge() { const el = document.getElementById('sync'); if (!el) return; el.className = 'sync' + (online && !dirty ? '' : ' off'); el.textContent = !online ? 'אין חיבור, נשמר בטלפון' : dirty ? 'שומר...' : 'מסונכרן'; }
addEventListener('online', () => { online = true; push(); pull(); });
addEventListener('offline', () => { online = false; syncBadge(); });
setInterval(() => { if (dirty) push(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && TOKEN && !dirty) pull(); if (document.visibilityState === 'hidden' && dirty) push(); });
function logout() { TOKEN = ''; LS.set('token', ''); render(); }

// ---------- schedule ----------
const SEQ = ['A', 'B', 'C'];
const doneSessions = () => D.sessions.filter(s => s.status === 'done').sort((a, b) => (a.date + (a.endedAt || '')).localeCompare(b.date + (b.endedAt || '')));
function nextType() { const ds = doneSessions(); if (!ds.length) return 'A'; return SEQ[(SEQ.indexOf(ds[ds.length - 1].type) + 1) % 3]; }
const isTrainDay = s => (D.days.includes(dow(s)) || D.extra[s]) && !D.postponed[s];
const sessOn = s => D.sessions.filter(x => x.date === s);
// upcoming plan: queue A-B-C from the next type, on the coming training days (today included if nothing done today)
function upcoming(n) {
  const out = []; let t = nextType(); let d = today(); const doneToday = sessOn(d).some(x => x.status === 'done');
  if (doneToday) d = addDays(d, 1);
  for (let i = 0; out.length < n && i < 120; i++, d = addDays(d, 1)) {
    if (!isTrainDay(d)) continue; if (sessOn(d).some(x => x.status === 'skipped')) continue;
    out.push({ date: d, type: t }); t = SEQ[(SEQ.indexOf(t) + 1) % 3];
  }
  return out;
}
function dayStatus(s) {
  const ss = sessOn(s), t = today();
  const done = ss.find(x => x.status === 'done'); if (done) return { st: 'done', type: done.type };
  const sk = ss.find(x => x.status === 'skipped'); if (sk) return { st: 'skip', type: sk.type };
  if (D.postponed[s]) return { st: 'post' };
  if (s < t && s >= D.start && (D.days.includes(dow(s)) || D.extra[s])) return { st: 'miss' };
  const u = upcoming(40).find(x => x.date === s); if (u) return { st: 'plan', type: u.type };
  return { st: '' };
}
function weekDone() { const ws = weekStart(today()); return D.sessions.filter(s => s.status === 'done' && s.date >= ws && s.date <= addDays(ws, 6)).length; }

// ---------- helpers ----------

  const ds = doneSessions();
  for (let i = ds.length - 1; i >= 0; i--) { const e = ds[i].ex.find(x => x.id === exId || x.name === exName); if (e && e.sets.some(s => s.done)) return { date: ds[i].date, sets: e.sets.filter(s => s.done) }; }

// ---------- charts (plain SVG) ----------
function lineChart(points, opts) {
  opts = opts || {}; const W = 600, H = 220, P = 34;
  if (points.length < 2) return `<div class="muted center" style="padding:24px 0">${points.length ? 'עוד מדידה אחת וכאן יופיע גרף' : 'אין עדיין נתונים'}</div>`;
  const xs = points.map(p => parse(p.x).getTime()), ys = points.map(p => +p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (opts.target != null) { y0 = Math.min(y0, opts.target); y1 = Math.max(y1, opts.target); }
  const pd = (y1 - y0) * 0.15 || 1; y0 -= pd; y1 += pd; if (x1 === x0) x1 = x0 + 1;
  const X = t => W - 62 - (t - x0) / (x1 - x0) * (W - P - 62), Y = v => H - 26 - (v - y0) / (y1 - y0) * (H - 46);
  const path = points.map((p, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(ys[i]).toFixed(1)).join(' ');
  const ticks = [y0 + pd, (y0 + y1) / 2, y1 - pd];
  let g = ticks.map(v => `<line x1="${P}" x2="${W - 56}" y1="${Y(v)}" y2="${Y(v)}" stroke="#243041" stroke-dasharray="3 5"/><text x="${W - 4}" y="${Y(v) + 4}" fill="#8b9bb0" font-size="15" text-anchor="end">${num(v)}</text>`).join('');
  if (opts.target != null) g += `<line x1="${P}" x2="${W - P}" y1="${Y(opts.target)}" y2="${Y(opts.target)}" stroke="#f59e0b" stroke-dasharray="6 4"/>`;
  const dots = points.map((p, i) => `<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="4.5" fill="${opts.color || '#22c55e'}"/>`).join('');
  const lab = [points[0], points[points.length - 1]].map((p, i) => `<text x="${X(i ? xs[xs.length - 1] : xs[0])}" y="${H - 4}" fill="#8b9bb0" font-size="15" text-anchor="middle">${fmtD(p.x)}</text>`).join('');
  return `<svg class="chart" direction="ltr" style="direction:ltr" viewBox="0 0 ${W} ${H}">${g}<path d="${path}" fill="none" stroke="${opts.color || '#22c55e'}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lab}</svg>`;
}
function barChart(items, max, target) {
  const W = 600, H = 170, n = items.length, bw = (W - 20) / n;
  const m = Math.max(max || 0, ...items.map(i => i.v), 1);
  return `<svg class="chart" direction="ltr" style="direction:ltr" viewBox="0 0 ${W} ${H}">${target ? `<line x1="0" x2="${W}" y1="${H - 26 - target / m * (H - 46)}" y2="${H - 26 - target / m * (H - 46)}" stroke="#f59e0b" stroke-dasharray="6 4"/>` : ''}` +
    items.map((it, i) => { const h = it.v / m * (H - 46), x = W - 10 - (i + 1) * bw + 6; return `<rect x="${x}" y="${H - 26 - h}" width="${bw - 12}" height="${Math.max(h, 2)}" rx="6" fill="${it.v >= (target || 1e9) ? '#22c55e' : '#38bdf8'}"/><text x="${x + (bw - 12) / 2}" y="${H - 6}" fill="#8b9bb0" font-size="14" text-anchor="middle">${esc(it.l)}</text>${it.v ? `<text x="${x + (bw - 12) / 2}" y="${H - 32 - h}" fill="#e8eef5" font-size="15" text-anchor="middle">${it.v}</text>` : ''}`; }).join('') + '</svg>';
}

function bindLogin() {

function compress(file, cb) {
  const img = new Image(), rd = new FileReader();
  rd.onload = () => { img.onload = () => { const m = 640, s = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', 0.72)); }; img.src = rd.result; };
  rd.readAsDataURL(file);
}

     <li>תחת <b>גוף הבקשה</b> בחר <b>JSON</b> והוסף 2 שדות:<br>שדה טקסט בשם <b>p_key</b> עם הערך:${copyBtn(key)}<br>שדה מספר בשם <b>p_steps</b>, ובערך בחר את המשתנה <b>סטטיסטיקה</b> (התוצאה של שלב 3).</li>
     <li>לחץ <b>סיום</b>. כדי לבדוק עכשיו: פתח את האוטומציה ולחץ על כפתור ההפעלה. בפעם הראשונה האייפון יבקש אישור לקרוא את הצעדים, אשר.</li></ol>
     <p class="muted" style="font-size:13px;margin:10px 0 0">אפשר להוסיף עוד אוטומציה זהה בשעה אחרת. כל שליחה מעדכנת את הצעדים של אותו יום. שמור את הקוד בסוד.</p>` : ''}
    <button class="btn sec mt12" data-close>סגירה</button>`;
    const mk = el.querySelector('#mk'); if (mk) mk.onclick = async () => { mk.disabled = true; mk.innerHTML = '<span class="spin"></span>'; try { const r = await rpc('fit_steps_key', { p_token: TOKEN }); if (!r.ok) throw 0; HEALTH = { linked: true, last: null }; LS.set('health', HEALTH); draw(el, r.key); } catch (e) { toast('אין חיבור. נסה שוב.'); draw(el); } };
    el.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('הועתק'); } catch (e) { const r = document.createRange(); r.selectNodeContents(b); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('סמן והעתק'); } });
  };
  const el = sheet(''); draw(el);
}
function postpone(d) { D.postponed[d] = true; const n = addDays(d, 1); if (!isTrainDay(n)) D.extra[n] = true; }
function viewSession(id) {
  const s = D.sessions.find(x => x.id === id); if (!s) return;
  sheet(`<h2>${esc(D.plan[s.type] ? D.plan[s.type].name : s.type)}</h2><p class="muted">${DAYS[dow(s.date)]} ${fmtD(s.date)}${s.mins ? ' · ' + s.mins + ' דקות' : ''}</p>
   ${s.note ? `<p>${esc(s.note)}</p>` : ''}<div class="row mt12"><button class="btn sec" data-close>סגירה</button><button class="btn danger" id="del">מחיקה</button></div>`, el => {
    el.querySelector('#del').onclick = () => ask('למחוק את האימון הזה?', 'כן, למחוק', 'לא', () => { D.sessions = D.sessions.filter(x => x.id !== id); save(); el.remove(); render(); });
  });
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-act],[data-plan],[data-open],[data-step],[data-done],[data-cal],[data-off],[data-day],[data-wd],[data-m],[data-fd],[data-add],[data-q]');
  if (!t || t.closest('.sheet')) return;
  const ds = t.dataset;
  if (ds.go) return go(ds.go);
  if (ds.plan) { sub.plan = ds.plan; return render(); }
  if (ds.open != null) { const i = +ds.open; sub.open = sub.open === i ? -1 : i; return render(); }
  if (ds.cal) { sub.cal = ds.cal; sub.off = 0; return render(); }
  if (ds.off) { sub.off = (sub.off || 0) + +ds.off; return render(); }
  if (ds.day) return dayMenu(ds.day);
  if (ds.wd != null) { const i = +ds.wd; D.days = D.days.includes(i) ? D.days.filter(x => x !== i) : D.days.concat(i).sort(); save(); return render(); }
  if (ds.m) { sub.m = ds.m; return render(); }
  if (ds.fd) { if (ds.fd > today()) return; sub.fd = ds.fd; return render(); }
  if (ds.add) { const [k, v] = ds.add.split(','); const f = foodDay(sub.fd || today()); f[k] = +(((+f[k] || 0) + +v).toFixed(2)); save(); return render(); }
  if (ds.q) { const qa = document.getElementById('qa'); qa.value = ds.q; return sendChat(); }
  const s = D && D.sessions.find(x => x.status === 'active');
  if (ds.step) { const [i, j, k, d] = ds.step.split(','); const st = s.ex[+i].sets[+j]; const inc = k === 'w' ? (s.ex[+i].unit === 'שניות' ? 5 : 2.5) : 1; st[k] = Math.max(0, +(((+st[k] || 0) + inc * +d).toFixed(2))); save(); return render(); }
  if (ds.done) { const [i, j] = ds.done.split(',').map(Number); const st = s.ex[i].sets[j]; st.done = !st.done;
    if (st.done && s.ex[i].sets[j + 1] && s.ex[i].sets[j + 1].w === '') { s.ex[i].sets[j + 1].w = st.w; }
    if (s.ex[i].sets.every(x => x.done)) { sub.open = s.ex.findIndex(x => !x.sets.every(y => y.done)); if (navigator.vibrate) navigator.vibrate(30); }
    save(); return render(); }
  const a = ds.act;
  if (a === 'markdone') return markDone(ds.type);
  if (a === 'showplan') { view = 'train'; sub = { plan: ds.type }; render(); return scrollTo(0, 0); }
  if (a === 'resume') return go('train');
  if (a === 'postpone') { postpone(ds.date); save(); render(); return toast('האימון עבר ליום הבא'); }
  if (a === 'skip') return ask('לסמן שדילגת על האימון היום? הוא יישאר הבא בתור.', 'כן, דילגתי', 'לא', () => { D.sessions.push({ id: uid(), date: ds.date, type: ds.type, status: 'skipped', ex: [] }); save(); render(); });
  if (a === 'addset') { const x = s.ex[+ds.i]; const l = x.sets[x.sets.length - 1]; x.sets.push({ w: l ? l.w : '', r: l ? l.r : '', done: false }); save(); return render(); }
  if (a === 'delset') { s.ex[+ds.i].sets.pop(); save(); return render(); }
  if (a === 'exnote') { const x = s.ex[+ds.i]; return sheet(`<h2>הערה: ${esc(x.name)}</h2><textarea class="in" id="nt" rows="3">${esc(x.note)}</textarea><div class="row mt12"><button class="btn" id="ns">שמירה</button><button class="btn sec" data-close>ביטול</button></div>`, el => el.querySelector('#ns').onclick = () => { x.note = el.querySelector('#nt').value; const pe = D.plan[s.type].ex.find(y => y.id === x.id); if (pe) pe.note = x.note; save(); el.remove(); render(); }); }
  if (a === 'finish') { const n = s.ex.reduce((c, x) => c + x.sets.filter(y => y.done).length, 0);
    const fin = () => { s.status = 'done'; s.endedAt = new Date().toISOString(); s.mins = Math.round((Date.now() - s.startedAt) / 60000); s.ex.forEach(x => x.sets.forEach(y => { if (y.w !== '') y.w = +y.w; if (y.r !== '') y.r = +y.r; })); save(true); go('home'); toast('כל הכבוד! האימון נשמר 💪'); };
    if (!n) return toast('עוד לא סימנת אף סט'); if (s.ex.some(x => !x.sets.every(y => y.done))) return ask('לא כל הסטים סומנו. לסיים את האימון בכל זאת?', 'כן, לסיים', 'להמשיך', fin); return fin(); }
  if (a === 'cancelsess') return ask('לבטל את האימון? מה שהזנת בו לא יישמר.', 'כן, לבטל', 'לא', () => { D.sessions = D.sessions.filter(x => x !== s); save(); go('train'); });
  if (a === 'editplan') return planSheet(ds.type);
  if (a === 'viewsess') return viewSession(ds.id);
  if (a === 'addbody') return bodySheet(today(), true);
  if (a === 'editbody') return bodySheet(ds.date);
  if (a === 'health') return healthSheet();
  if (a === 'tg') { D.settings.tg = !D.settings.tg; save(); return render(); }
  if (a === 'logout') return ask('לצאת מהמכשיר הזה? הנתונים שמורים, ונכנסים שוב עם הקוד.', 'כן, לצאת', 'לא', () => { push(); logout(); });
  if (a === 'export') { const b = new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' }); const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = 'fittrack-' + today() + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000); return; }
  if (a === 'import') { const f = document.getElementById('impfile'); f.onchange = () => { const file = f.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => { try { const x = JSON.parse(rd.result); if (!x.plan || !x.sessions) throw 0; ask('לשחזר מהגיבוי? הנתונים הנוכחיים יוחלפו.', 'כן, לשחזר', 'לא', () => { D = x; save(true); render(); toast('שוחזר'); }); } catch (er) { toast('הקובץ לא תקין'); } }; rd.readAsText(file); }; return f.click(); }
  if (a === 'tip') { const box = document.getElementById('tipbox'); box.innerHTML = '<span class="spin"></span> המאמן עובר על הנתונים...'; t.disabled = true;
    try { D.ai.tip = await askAI('tip', [{ role: 'user', content: 'מה ההמלצה שלך להיום?' }]); D.ai.tipDate = today(); save(); } catch (er) { toast(er.message === 'limit' ? 'הגעת למגבלה היומית' : 'אין חיבור למאמן כרגע'); }
    return render(); }
  if (a === 'send') return sendChat();
  if (a === 'clearchat') { D.ai.chat = []; save(); return render(); }
});
async function sendChat() {
  const qa = document.getElementById('qa'), q = (qa.value || '').trim(); if (!q) return;
  D.ai.chat = D.ai.chat || []; D.ai.chat.push({ role: 'user', content: q, at: Date.now() }); save(); render();
  const box = document.getElementById('chat'); box.insertAdjacentHTML('beforeend', '<div class="msg a" id="wait"><span class="spin"></span> חושב...</div>'); scrollTo(0, document.body.scrollHeight);
  try { const ans = await askAI('chat', D.ai.chat.slice(-12).map(m => ({ role: m.role, content: m.content }))); D.ai.chat.push({ role: 'assistant', content: ans, at: Date.now() }); save(); }
  catch (er) { D.ai.chat.pop(); toast(er.message === 'limit' ? 'הגעת למגבלה היומית' : 'אין חיבור למאמן כרגע. נסה שוב.'); }
  render(); scrollTo(0, document.body.scrollHeight);
}
document.addEventListener('input', e => {
  const t = e.target, ds = t.dataset; if (!D) return;
  if (ds.in) { const s = D.sessions.find(x => x.status === 'active'); const [i, j, k] = ds.in.split(','); s.ex[+i].sets[+j][k] = t.value.replace(',', '.'); D.updatedAt = Date.now(); LS.set('data', D); dirty = true; clearTimeout(save.t); save.t = setTimeout(push, 2500); }
  if (ds.food) { const f = foodDay(sub.fd || today()); f[ds.food] = t.value === '' ? '' : +t.value.replace(',', '.'); const tg = +D.targets[ds.food] || 0, bar = t.closest('.card').querySelector('.bar'); if (bar && tg) { const pc = Math.min(100, (+f[ds.food] || 0) / tg * 100); bar.firstElementChild.style.width = pc + '%'; bar.classList.toggle('o', pc < 60); } D.updatedAt = Date.now(); LS.set('data', D); dirty = true; clearTimeout(save.t); save.t = setTimeout(push, 1500); }
  if (ds.pf) { const [o, k] = ds.pf.split('.'); const old = D[o][k]; D[o][k] = typeof old === 'number' && t.value !== '' && !isNaN(t.value) ? +t.value : t.value; D.updatedAt = Date.now(); LS.set('data', D); dirty = true; clearTimeout(save.t); save.t = setTimeout(push, 1500); }
});
document.addEventListener('change', e => { if (e.target.matches('[data-exsel]')) { sub.ex = e.target.value; render(); } });
setInterval(() => { const el = document.getElementById('timer'), s = D && D.sessions.find(x => x.status === 'active'); if (el && s) el.textContent = Math.floor((Date.now() - s.startedAt) / 60000) + " דק'"; }, 20000);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
if (TOKEN) pull();
</script>

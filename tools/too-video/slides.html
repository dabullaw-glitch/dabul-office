<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<!-- Team of One lesson video slides (25.11.2026, pilot). Driven by render.py with Playwright: window.show(deck, i, step)
     draws slide i with its first `step` reveal items. 1280x720 css at device scale 1.5 = 1920x1080.
     The lesson content (deck JSON) is paid material and is never stored in this repo. -->
<style>
  @font-face{font-family:Karantina;src:local('Karantina Bold'),local('Karantina-Bold');font-weight:700}
  :root{--ink:#0B0B0C;--ink2:#141416;--ink3:#1C1C20;--paper:#F3F0E8;--fg:#F6F4EE;--mut:#A3A099;--lime:#D7FF3B;--hot:#FF5A1F;
    --disp:Karantina,Rubik,Arial,sans-serif;--body:Rubik,Arial,sans-serif;--lat:"Space Grotesk",Rubik,sans-serif}
  html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #s{position:absolute;inset:0;padding:96px 92px 70px;box-sizing:border-box;
     background:radial-gradient(900px 520px at 85% -10%,rgba(215,255,59,.10),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(255,255,255,.05),transparent 60%),var(--ink)}
  .main{position:absolute;top:92px;bottom:64px;right:92px;left:92px;display:flex;flex-direction:column;justify-content:center;align-items:stretch}
  .main>.k{align-self:flex-start}
  .top{position:absolute;top:30px;right:92px;left:92px;display:flex;justify-content:space-between;align-items:center}
  .logo{display:flex;gap:10px;align-items:center}.logo img{width:30px;height:30px}
  .logo b{font-family:var(--lat);font-weight:700;font-size:19px;letter-spacing:-.3px;direction:ltr}
  .les{font-size:16px;color:var(--mut);font-weight:500}
  .prog{position:absolute;bottom:0;right:0;height:6px;background:var(--lime)}
  .num{position:absolute;bottom:22px;left:92px;font-family:var(--lat);font-size:15px;color:var(--mut);direction:ltr}
  .k{display:inline-block;background:var(--lime);color:var(--ink);font-weight:800;font-size:18px;padding:6px 14px;border-radius:999px;margin-bottom:18px}
  h1{font-family:var(--disp);font-weight:700;font-size:96px;line-height:.9;margin:0 0 26px;letter-spacing:0}
  h1.sm{font-size:74px}
  .r{opacity:0;transform:translateY(14px)}.r.on{opacity:1;transform:none}
  .grid{display:grid;gap:18px}
  .card{background:var(--ink2);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:22px 24px}
  .card b{display:block;font-size:26px;font-weight:800;margin-bottom:6px}
  .card span{font-size:19px;color:#CFCBC2;line-height:1.45}
  .stat{display:flex;gap:22px;align-items:center}.stat .n{font-family:var(--disp);font-size:120px;line-height:.8;color:var(--lime);min-width:70px;text-align:center}
  .stat .t{font-size:28px;font-weight:600;line-height:1.3}
  .foot{margin-top:26px;font-size:30px;font-weight:800;color:var(--ink);background:var(--lime);display:inline-block;padding:10px 20px;border-radius:14px}
  .warn .card{border-color:rgba(255,90,31,.45)}.warn .fix{margin-top:14px;font-size:20px;font-weight:800;color:var(--lime)}
  .warn .fix:before{content:'✓ '}
  .ic{width:44px;height:44px;border-radius:12px;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;margin-bottom:14px;font-family:var(--lat)}
  .warn .ic{background:var(--hot);color:#fff}
  .lines div{font-size:34px;line-height:1.35;margin:0 0 20px;padding-right:26px;border-right:5px solid var(--lime)}
  .lines div.last{color:var(--lime);font-weight:800}
  .big{font-family:var(--disp);font-size:150px;line-height:.85;margin:0}.big.l{color:var(--lime)}
  .flow{display:flex;gap:16px;align-items:center;margin-top:40px}.flow div{background:var(--ink3);border-radius:16px;padding:16px 26px;font-size:26px;font-weight:700}
  .flow i{font-style:normal;color:var(--lime);font-size:30px}
  .three{display:flex;gap:22px}.three .card{flex:1;text-align:center;padding:34px 20px}.three .card .n{font-family:var(--disp);font-size:110px;color:var(--lime);line-height:.8}
  .three .card b{font-size:30px;margin-top:10px}
  table{border-collapse:separate;border-spacing:0;width:640px;font-size:22px;border-radius:16px;overflow:hidden}
  th{background:#000;color:var(--fg);padding:12px 16px;text-align:right;font-weight:800}
  td{background:#FFF4B8;color:var(--ink);padding:10px 16px;border-top:2px solid var(--ink)}
  td.c{background:#ECEAE4}
  tr.hl td{background:var(--lime)}
  .side{display:flex;gap:40px;align-items:flex-start}.side .note{flex:1;font-size:24px;line-height:1.45;color:#DDD8CD}
  .pr{background:var(--paper);color:var(--ink);border-radius:20px;padding:22px 26px;font-size:22px;line-height:1.5;box-sizing:border-box}
  .pr .q{color:#5E5A52;font-size:18px;font-weight:700;margin-bottom:6px}
  .cols{display:flex;gap:16px;margin-top:22px}.cols .card{flex:1}
  .note2{margin-top:22px;font-size:24px;color:var(--lime);font-weight:700}
  .qs div{display:flex;gap:20px;align-items:center;font-size:36px;font-weight:600;margin:0 0 26px}
  .qs div span{font-family:var(--disp);font-size:70px;color:var(--lime);min-width:44px;line-height:.8}
  .end h1{font-size:64px;line-height:1.05;max-width:1050px;font-family:var(--body);font-weight:800}
  .next{margin-top:30px;font-size:28px;color:var(--mut)}.next b{color:var(--fg)}
  .lv .dot{width:22px;height:22px;border-radius:50%;margin-bottom:16px}.lv .c0{background:var(--lime)}.lv .c1{background:#FFD23F}.lv .c2{background:var(--hot)}
  .lv .act{margin-top:14px;font-size:21px;font-weight:800;color:var(--fg)}
  .ba .tag{display:inline-block;font-weight:800;font-size:18px;padding:4px 12px;border-radius:999px;background:var(--ink3);color:var(--mut);margin-bottom:14px}.ba .tag.on{background:var(--lime);color:var(--ink)}
  .ba .tx{font-size:27px;line-height:1.5}
  .title .k{align-self:flex-start}
  .title h1{font-size:150px;max-width:820px}.title p{font-size:30px;color:#CFCBC2;max-width:900px;margin:0;line-height:1.4}
  .dots{position:absolute;left:10px;top:50%;margin-top:-140px;width:280px;height:280px;opacity:.9}
</style></head>
<body><div id="s"></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const R = (k, step, html, cls = '') => `<div class="r ${cls} ${k <= step ? 'on' : ''}">${html}</div>`;
window.steps = (d) => d.cues.length;
window.show = (deck, i, step) => {
  const d = deck.slides[i], n = deck.slides.length;
  let b = '';
  const head = `<span class="k">${esc(d.kicker)}</span>`;
  if (d.type === 'title') b = `<div class="title">${head}<h1>${esc(d.h)}</h1><p>${esc(d.sub)}</p></div>
     <svg class="dots" viewBox="0 0 40 40"><circle cx="20" cy="20" r="5.5" fill="#D7FF3B"/><g fill="#D7FF3B" opacity=".45"><circle cx="20" cy="8" r="2.2"/><circle cx="30.4" cy="14" r="2.2"/><circle cx="30.4" cy="26" r="2.2"/><circle cx="20" cy="32" r="2.2"/><circle cx="9.6" cy="26" r="2.2"/><circle cx="9.6" cy="14" r="2.2"/></g></svg>`;
  if (d.type === 'stats') b = `${head}<h1 class="sm">${esc(d.h)}</h1><div class="grid" style="grid-template-columns:repeat(3,1fr)">${d.items.map((x, j) => R(j + 1, step, `<div class="stat"><div class="n">${esc(x[0])}</div><div class="t">${esc(x[1])}</div></div>`, 'card')).join('')}</div>${R(4, step, `<div class="foot">${esc(d.foot)}</div>`)}`;
  if (d.type === 'cards') b = `${head}<h1 class="sm">${esc(d.h)}</h1><div class="grid" style="grid-template-columns:repeat(${d.items.length},1fr)">${d.items.map((x, j) => R(j + 1, step, `<div class="ic">${j + 1}</div><b>${esc(x[0])}</b><span>${esc(x[1])}</span>`, 'card')).join('')}</div>`;
  if (d.type === 'warn') b = `${head}<h1 class="sm">${esc(d.h)}</h1><div class="grid warn" style="grid-template-columns:repeat(3,1fr)">${d.items.map((x, j) => R(j + 1, step, `<div class="ic">!</div><b>${esc(x[0])}</b><span>${esc(x[1])}</span><div class="fix">${esc(x[2])}</div>`, 'card')).join('')}</div>`;
  if (d.type === 'story') b = `${head}<h1>${esc(d.h)}</h1><div class="lines">${d.lines.map((x, j) => R(j + 1, step, esc(x), j === d.lines.length - 1 ? 'last' : '')).join('')}</div>`;
  if (d.type === 'rule') b = `${head}<p class="big">${esc(d.h)}</p>${R(1, step, `<p class="big l">${esc(d.h2)}</p>`)}${R(2, step, `<div class="flow">${d.flow.map((x) => `<div>${esc(x)}</div>`).join('<i>←</i>')}</div>`)}`;
  if (d.type === 'three') b = `${head}<h1>${esc(d.h)}</h1><div class="three">${d.items.map((x, j) => R(j + 1, step, `<div class="n">${j + 1}</div><b>${esc(x)}</b>`, 'card')).join('')}</div>${R(4, step, `<div class="foot">${esc(d.foot)}</div>`)}`;
  if (d.type === 'sheet') b = `${head}<h1 class="sm">${esc(d.h)}</h1><div class="side">${R(1, step, `<table><tr><th>משימה</th><th>שעות בשבוע (דוגמה)</th><th>שעות בחודש</th></tr>${d.rows.map((r, j) => `<tr class="${step >= 4 && j === 2 ? 'hl' : ''}"><td>${esc(r[0])}</td><td>${step >= 2 ? esc(r[1]) : ''}</td><td class="c">${step >= 3 ? (Math.round(parseFloat(r[1]) * 4.33 * 10) / 10) : ''}</td></tr>`).join('')}</table>`)}${R(3, step, `<div class="note">${esc(d.foot)}${step >= 4 ? '<div class="note2">← הראשונה להעברה</div>' : ''}</div>`)}</div>`;
  if (d.type === 'prompt') b = `${head}<h1 class="sm">${esc(d.h)}</h1>${R(1, step, `<div class="pr"><div class="q">${esc(d.q || 'ההוראה המוכנה מהשיעור')}</div>${esc(d.prompt || 'הנה רשימת משימות מהשבוע שלי, עם הזמן שכל אחת לקחה: ___. לכל משימה כתוב בטבלה...')}</div>`)}<div class="cols">${d.cols.map((x, j) => R(j + 2, step, `<b>${esc(x[0])}</b><span>${esc(x[1])}</span>`, 'card')).join('')}</div>${R(d.cols.length + 2, step, `<div class="note2">${esc(d.note)}</div>`)}`;
  // levels: [name, examples, what to do] with a green / yellow / red marker (lesson 2 on). ba: before and after, then a line.
  if (d.type === 'levels') b = `${head}<h1 class="sm">${esc(d.h)}</h1><div class="grid lv" style="grid-template-columns:repeat(${d.items.length},1fr)">${d.items.map((x, j) => R(j + 1, step, `<div class="dot c${j}"></div><b>${esc(x[0])}</b><span>${esc(x[1])}</span><div class="act">${esc(x[2])}</div>`, 'card')).join('')}</div>`;
  if (d.type === 'ba') b = `${head}<h1 class="sm">${esc(d.h)}</h1><div class="grid ba" style="grid-template-columns:1fr 1fr">${R(1, step, `<div class="tag">לפני</div><div class="tx">${esc(d.before)}</div>`, 'card')}${R(2, step, `<div class="tag on">אחרי</div><div class="tx">${esc(d.after)}</div>`, 'card')}</div>${R(3, step, `<div class="foot">${esc(d.foot)}</div>`)}`;
  if (d.type === 'questions') b = `${head}<h1>${esc(d.h)}</h1><div class="qs">${d.items.map((x, j) => R(j + 1, step, `<span>${j + 1}</span>${esc(x)}`)).join('')}</div>`;
  if (d.type === 'end') b = `<div class="end" style="display:flex;flex-direction:column">${head.replace('class="k"','class="k" style="align-self:flex-start"')}<h1>${esc(d.h)}</h1>${R(1, step, `<div class="next"><b>${esc(d.next)}</b></div>`)}</div>`;
  document.getElementById('s').innerHTML = `<div class="main">${b}</div><div class="top"><div class="logo"><img src="logo.svg"><b>Team of One</b></div><div class="les">${esc(deck.lesson)} · ${esc(deck.title)}</div></div>
    <div class="prog" style="width:${((i + 1) / n) * 100}%"></div><div class="num">${i + 1} / ${n}</div>`;
};
</script></body></html>

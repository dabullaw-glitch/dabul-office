<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>חתימה על מסמך</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F2F6F7;--panel:#fff;--ink:#0E2226;--muted:#62797A;--line:#E3E7E5;--accent:#12A096;--accent-soft:#DCF3F1;--teal:#0B7F6B;--teal-soft:#D5F0E9;--bad:#C13B2E;--bad-soft:#FBE1DD;--side:#13968E;--r:16px;--shadow:0 1px 2px rgba(14,34,38,.05),0 12px 30px -16px rgba(14,34,38,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#081517;--panel:#0F2225;--ink:#E7EEEC;--muted:#8FA6A4;--line:#1E363A;--accent:#3CC7BB;--accent-soft:#123A38;--teal:#5FD8C0;--teal-soft:#0F3531;--bad:#F07A6D;--bad-soft:#3A1713;--side:#0B4F4B}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Heebo","Arial Hebrew",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(160deg,#1DB3A8,#0F857E);color:#E7EEEC;padding:16px 16px 18px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:#fff;color:#12A096!important;display:grid;place-items:center;font:900 21px "Heebo",sans-serif;color:#fff;flex:none}
.brand b{display:block;font-size:15.5px}.brand small{color:rgba(255,255,255,.8);font-size:13px}
h1{font:900 25px/1.25 "Heebo",sans-serif;margin:16px 0 2px}
.sub{color:rgba(255,255,255,.88);margin:0;font-size:15px}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;border:1px solid var(--line);margin:18px auto;max-width:520px}
.card h2{font:800 21px "Heebo";margin:0 0 6px}
.muted{color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 16px "Heebo";padding:12px 18px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn.full{width:100%}
input.code{font:800 30px "Heebo";letter-spacing:.5em;text-align:center;width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);direction:ltr}
input.code:focus,input.txt:focus{outline:none;border-color:var(--accent)}
input.txt{font:600 17px "Heebo";width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.err{color:var(--bad);font-weight:700;margin:10px 0 0}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:12px 0 0;font-weight:600}
.pages{padding:14px 0 120px;display:grid;gap:14px;justify-items:center}
.pg{position:relative;background:#fff;box-shadow:var(--shadow);border-radius:4px;overflow:hidden;max-width:100%}
.pg canvas{display:block;width:100%;height:auto}
.pg .num{position:absolute;bottom:6px;left:8px;font:700 12px "Heebo";color:#62797A;background:#fff9;border-radius:6px;padding:0 6px}
.box{position:absolute;border:2px dashed var(--accent);background:rgba(18,160,150,.12);border-radius:6px;display:grid;place-items:center;font:800 13px "Heebo";color:#0E8C83;cursor:pointer;padding:0;overflow:hidden}
.box.todo{animation:pulse 1.6s ease-in-out infinite}
.box.done{border:1.5px solid rgba(11,127,107,.5);background:rgba(11,127,107,.05);animation:none}
.box img{width:100%;height:100%;object-fit:contain}
.box .tx{font:700 13px "Heebo";color:#0b1d4a;white-space:nowrap;overflow:hidden}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,160,150,.45)}50%{box-shadow:0 0 0 6px rgba(18,160,150,0)}}
@media (prefers-reduced-motion:reduce){.box.todo{animation:none}}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -8px 24px -12px rgba(0,0,0,.25);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .prog{flex:1;min-width:140px;font-weight:700}
.bar .track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}.bar .track i{display:block;height:100%;background:var(--teal);transition:width .4s}
.sheet{position:fixed;inset:0;background:rgba(5,14,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet .in{background:var(--panel);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:96vh;overflow:auto}
@media (min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:20px}}
.sheet h3{margin:0 0 4px;font:800 19px "Heebo"}
.pad{width:100%;height:210px;border:2px dashed var(--line);border-radius:14px;background:#fff;touch-action:none;display:block;margin:10px 0}
.pad.small{height:150px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-weight:600;cursor:pointer}
label.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--teal)}
.center{text-align:center}
.big{font-size:52px;line-height:1;margin:6px 0 10px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:6px 16px 30px}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div class="brand"><div class="mark">ד</div><div><b id="office">משרד עורכי דין</b><small id="ophone"></small></div></div><h1 id="title">חתימה על מסמך</h1><p class="sub" id="subt">טוען...</p></div></div>
<main id="app" class="wrap"><div class="card center"><span class="spin"></span></div></main>
<script src="https://mgjmnvpnovkewvqevjmz.supabase.co/functions/v1/app/config.js?v=f291dc1cb3"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
const C = window.OFFICE_CONFIG || {};
const token = location.hash.slice(1).replace(/[^A-Za-z0-9]/g, '');
const app = document.getElementById('app'), $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API = (C.functions || '') + '/sign';
const DEF = { sig:[180, 70, 'חתום כאן'], init:[90, 50, 'ראשי תיבות'], date:[130, 32, 'תאריך'], name:[180, 32, 'שם מלא'] };
let R = null, code = '', sigPng = '', initPng = '', fullName = '';
try { if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch(e) {}

const head = r => { if (!r) return; if (r.office) { $('#office').textContent = r.office.name || ''; $('#ophone').textContent = r.office.phone ? 'טלפון: ' + r.office.phone : ''; } $('#title').textContent = r.title || 'חתימה על מסמך'; };
const card = html => { app.innerHTML = `<div class="card">${html}</div>`; window.scrollTo(0, 0); };
const fail = (t, more = '') => { $('#subt').textContent = ''; card(`<div class="center"><div class="big">⚠️</div><h2>${t}</h2><p class="muted">${more || 'לשאלות אפשר לפנות למשרד.'}</p></div>`); };

if (!token || !C.functions) { fail('הקישור לא תקין'); return; }
const load = () => fetch(`${API}?t=${encodeURIComponent(token)}${code ? '&c=' + code : ''}`).then(r => r.status === 404 ? Promise.reject(404) : r.json());
load().then(route).catch(e => fail(e === 404 ? 'הקישור לא נמצא או שבוטל' : 'לא הצלחנו לטעון את המסמך', 'נסה שוב בעוד כמה דקות. אם זה חוזר, פנה למשרד.'));

function route(r){
  R = r; head(r);
  if (r.status === 'expired') return fail('תוקף הקישור הסתיים', 'אפשר לבקש מהמשרד קישור חדש.');
  if (r.status === 'locked') return fail('הקישור ננעל', 'היו כמה ניסיונות שגויים. המשרד קיבל הודעה ויכול לשלוח קישור חדש.');
  if (r.status === 'verify') return verify(r);
  if (r.status === 'signed') return signedView(r);
  view(r);
}

function verify(r){
  $('#subt').textContent = `שלום ${r.signer || ''}`;
  card(`<h2>אימות זהות</h2><p class="muted" style="margin-top:0">כדי לשמור על הפרטיות שלך, הקלד את 4 הספרות האחרונות של תעודת הזהות.</p>
    <form id="vf"><input class="code" id="vc" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" aria-label="4 ספרות אחרונות של תעודת הזהות" required>
    ${r.wrong ? `<p class="err">הספרות לא תואמות. נשארו ${Math.max(0, r.left)} ניסיונות.</p>` : ''}
    <button class="btn pri full" style="margin-top:14px">המשך למסמך</button></form>`);
  const inp = $('#vc'); setTimeout(() => inp.focus(), 50);
  $('#vf').onsubmit = e => { e.preventDefault(); const v = inp.value.replace(/\D/g, ''); if (v.length !== 4) return; code = v; e.submitter && (e.submitter.disabled = true);
    load().then(route).catch(() => fail('לא הצלחנו לבדוק', 'נסה שוב בעוד רגע.')); };
}

function signedView(r){
  $('#subt').textContent = 'המסמך כבר נחתם';
  card(`<div class="center"><div class="big">✅</div><h2>המסמך נחתם${r.signedAt ? ` ב-${new Date(r.signedAt).toLocaleDateString('he-IL')}` : ''}</h2><p class="muted">עותק חתום נשמר במשרד.</p>${r.pdf ? `<a class="btn ok full" href="${esc(r.pdf)}" target="_blank" rel="noopener">הורדת העותק החתום</a>` : ''}</div>`);
}

/* ---------- the document with the places to sign ---------- */
async function view(r){
  fullName = r.signerFull || '';
  $('#subt').textContent = `שלום ${r.signer || ''}, ${r.marks.length > 1 ? `יש ${r.marks.length} מקומות לחתימה במסמך` : 'יש מקום אחד לחתימה במסמך'}. לוחצים על כל מקום מסומן.`;
  app.innerHTML = `${r.note ? `<div class="note" style="margin-top:14px">${esc(r.note)}</div>` : ''}<div class="pages" id="pages"><div class="card center"><span class="spin"></span><p class="muted">טוען את המסמך...</p></div></div>`;
  document.body.insertAdjacentHTML('beforeend', `<div class="bar"><div class="in"><div class="prog"><span id="pt"></span><div class="track"><i id="pb" style="width:0"></i></div></div><button class="btn" id="bnext">למקום הבא</button><button class="btn ok" id="bfin" hidden>סיום וחתימה</button></div></div>`);
  let pdf;
  try { pdf = await pdfjsLib.getDocument({ url:r.pdf }).promise; } catch(e) { document.querySelector('.bar')?.remove(); return fail('לא הצלחנו לפתוח את המסמך', 'נסה לרענן את הדף.'); }
  const host = $('#pages'); host.innerHTML = '';
  const width = Math.min(host.clientWidth || 800, 860);
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p), vp0 = page.getViewport({ scale:1 }), scale = width / vp0.width, dpr = Math.min(2, window.devicePixelRatio || 1);
    const vp = page.getViewport({ scale:scale * dpr }), cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    const wrap = document.createElement('div'); wrap.className = 'pg'; wrap.style.width = width + 'px'; wrap.dataset.p = p; wrap.appendChild(cv);
    wrap.insertAdjacentHTML('beforeend', `<span class="num">עמוד ${p} מתוך ${pdf.numPages}</span>`); host.appendChild(wrap);
    await page.render({ canvasContext:cv.getContext('2d'), viewport:vp }).promise;
    r.marks.forEach((m, i) => { if (m.page !== p) return; const d = DEF[m.type] || DEF.sig, k = width / (m.pw || width);
      const b = document.createElement('button'); b.type = 'button'; b.className = 'box todo'; b.dataset.i = i; b.dataset.t = m.type || 'sig';
      Object.assign(b.style, { left:(m.x * k) + 'px', top:(m.y * k) + 'px', width:((m.w || d[0]) * k) + 'px', height:((m.h || d[1]) * k) + 'px' });
      b.setAttribute('aria-label', d[2]); b.textContent = d[2]; b.onclick = () => tap(m.type || 'sig'); wrap.appendChild(b); });
  }
  paint();
  $('#bnext').onclick = () => { const b = document.querySelector('.box.todo') || document.querySelector('.box'); if (b) { b.scrollIntoView({ behavior:'smooth', block:'center' }); setTimeout(() => b.focus(), 400); } };
  $('#bfin').onclick = finish;
}
const need = t => R.marks.some(m => (m.type || 'sig') === t);
const filled = t => t === 'sig' ? !!sigPng : t === 'init' ? !!(initPng || (!need('init'))) : t === 'name' ? !!fullName.trim() : true;
function paint(){
  let done = 0;
  document.querySelectorAll('.box').forEach(b => { const t = b.dataset.t, ok = t === 'date' ? !!sigPng : filled(t) && (t !== 'name' || !!sigPng);
    b.classList.toggle('todo', !ok); b.classList.toggle('done', ok); if (ok) done++;
    if (ok) b.innerHTML = t === 'sig' ? `<img src="${sigPng}" alt="החתימה שלך">` : t === 'init' ? `<img src="${initPng || sigPng}" alt="ראשי התיבות שלך">` : `<span class="tx">${esc(t === 'date' ? new Date().toLocaleDateString('he-IL') : fullName)}</span>`;
    else b.textContent = (DEF[t] || DEF.sig)[2]; });
  const all = document.querySelectorAll('.box').length;
  $('#pt').textContent = `הושלמו ${done} מתוך ${all} מקומות`; $('#pb').style.width = (all ? done / all * 100 : 0) + '%';
  const complete = done === all; $('#bfin').hidden = !complete; $('#bnext').hidden = complete;
}

/* ---------- signature pad ---------- */
function tap(t){
  if (t === 'date' || t === 'name') t = 'sig';
  const isInit = t === 'init';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
  sh.innerHTML = `<div class="in"><h3>${isInit ? 'ראשי תיבות' : 'החתימה שלך'}</h3><p class="muted" style="margin:0">${isInit ? 'כתוב באצבע את ראשי התיבות שלך. הם ייכנסו לכל המקומות המסומנים לראשי תיבות.' : 'חתום באצבע בתוך המסגרת. החתימה תיכנס לכל המקומות המסומנים במסמך.'}</p>
    <canvas class="pad${isInit ? ' small' : ''}" id="pad" aria-label="משטח חתימה"></canvas>
    ${!isInit ? `<label for="fn" style="font-weight:700">שם מלא</label><input class="txt" id="fn" value="${esc(fullName)}" autocomplete="name" style="margin:6px 0 4px">` : ''}
    <p class="err" id="perr" hidden></p>
    <div class="row" style="margin-top:12px"><button class="btn ok" id="pok">אישור</button><button class="btn" id="pclr">ניקוי</button><button class="btn" id="pcl">סגירה</button></div></div>`;
  document.body.appendChild(sh);
  const pad = sh.querySelector('#pad'), ctx = pad.getContext('2d'), dpr = window.devicePixelRatio || 1;
  pad.width = pad.clientWidth * dpr; pad.height = pad.clientHeight * dpr; ctx.scale(dpr, dpr); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b1d4a';
  let drawing = false, ink = 0, last;
  const pt = e => { const r = pad.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
  pad.onpointerdown = e => { drawing = true; last = pt(e); pad.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, 7); ctx.fillStyle = '#0b1d4a'; ctx.fill(); };
  pad.onpointermove = e => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ink += Math.hypot(p.x - last.x, p.y - last.y); last = p; };
  pad.onpointerup = pad.onpointercancel = () => drawing = false;
  const close = () => sh.remove();
  sh.querySelector('#pcl').onclick = close;
  sh.querySelector('#pclr').onclick = () => { ctx.clearRect(0, 0, pad.width, pad.height); ink = 0; };
  sh.querySelector('#pok').onclick = () => {
    const err = sh.querySelector('#perr'); err.hidden = true;
    if (ink < 40) { err.textContent = isInit ? 'כתוב את ראשי התיבות במסגרת' : 'צריך לחתום בתוך המסגרת'; err.hidden = false; return; }
    if (!isInit) { const n = sh.querySelector('#fn').value.trim(); if (n.length < 2) { err.textContent = 'נא להקליד שם מלא'; err.hidden = false; return; } fullName = n; }
    const png = trim(pad); if (isInit) initPng = png; else sigPng = png;
    close(); paint();
    const nxt = document.querySelector('.box.todo'); if (nxt) setTimeout(() => nxt.scrollIntoView({ behavior:'smooth', block:'center' }), 150);
  };
}
// crop the drawing to the ink, so it fits the boxes nicely
function trim(c){
  const x = c.getContext('2d'), { width:w, height:h } = c, d = x.getImageData(0, 0, w, h).data;
  let t = h, l = w, r = 0, b = 0;
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) if (d[(y * w + i) * 4 + 3] > 10) { if (y < t) t = y; if (y > b) b = y; if (i < l) l = i; if (i > r) r = i; }
  const pad = 12; l = Math.max(0, l - pad); t = Math.max(0, t - pad); r = Math.min(w, r + pad); b = Math.min(h, b + pad);
  const o = document.createElement('canvas'); o.width = Math.max(10, r - l); o.height = Math.max(10, b - t);
  o.getContext('2d').drawImage(c, l, t, o.width, o.height, 0, 0, o.width, o.height); return o.toDataURL('image/png');
}

/* ---------- confirm and send ---------- */
function finish(){
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
  sh.innerHTML = `<div class="in"><h3>אישור וחתימה</h3><p class="muted" style="margin:0">החתימה שלך תיכנס ל-${R.marks.length} מקומות במסמך "${esc(R.title)}".</p>
    <label class="chk"><input type="checkbox" id="cc"><span>קראתי את המסמך, ואני מאשר/ת שהחתימה האלקטרונית שלי מחייבת אותי כמו חתימת ידי.</span></label>
    <p class="err" id="ferr" hidden></p>
    <div class="row"><button class="btn ok" id="fgo" disabled>חתימה ושליחה למשרד</button><button class="btn" id="fcl">חזרה למסמך</button></div></div>`;
  document.body.appendChild(sh);
  const go = sh.querySelector('#fgo'); sh.querySelector('#cc').onchange = e => go.disabled = !e.target.checked;
  sh.querySelector('#fcl').onclick = () => sh.remove();
  go.onclick = async () => {
    go.disabled = true; go.innerHTML = '<span class="spin"></span> שולח...'; const err = sh.querySelector('#ferr'); err.hidden = true;
    try {
      const res = await fetch(API, { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ t:token, c:code, png:sigPng, init:need('init') ? initPng : '', consent:true, typedName:fullName }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error({ expired:'תוקף הקישור הסתיים', already_signed:'המסמך כבר נחתם', locked:'הקישור ננעל', verify:'צריך לאמת שוב את הזהות. רענן את הדף.' }[j.error] || 'השליחה נכשלה. נסה שוב.');
      sh.remove(); document.querySelector('.bar')?.remove(); $('#subt').textContent = 'תודה!';
      card(`<div class="center"><div class="big">✅</div><h2>המסמך נחתם ונשלח למשרד</h2><p class="muted">אין צורך לעשות שום דבר נוסף. המשרד קיבל את המסמך החתום.</p>${j.pdf ? `<a class="btn ok full" href="${esc(j.pdf)}" target="_blank" rel="noopener">הורדת עותק חתום</a><p class="muted" style="font-size:13px;margin-bottom:0">הקישור להורדה פעיל לשעה הקרובה.</p>` : ''}</div>`);
    } catch(e) { err.textContent = e.message; err.hidden = false; go.disabled = false; go.textContent = 'נסה שוב'; }
  };
}
})();

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F857E">
<title>דוח הכנסות והוצאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F2F6F7;--panel:#fff;--ink:#0E2226;--muted:#5C7375;--line:#DDE4E3;--accent:#12A096;--accent-ink:#0B7F76;--soft:#DCF3F1;--ok:#0B7F6B;--bad:#C13B2E;--bad-soft:#FBE3E0;--r:16px;--shadow:0 1px 2px rgba(14,34,38,.05),0 10px 26px -16px rgba(14,34,38,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#081517;--panel:#0F2225;--ink:#E7EEEC;--muted:#93AAA8;--line:#22393C;--accent:#3CC7BB;--accent-ink:#5FD8C0;--soft:#123A38;--ok:#5FD8C0;--bad:#FF8A7A;--bad-soft:#3A1E1B}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Heebo","Arial Hebrew",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.top{background:linear-gradient(160deg,#1DB3A8,#0F857E);color:#fff;padding:18px 16px 54px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;opacity:.92}.mark{width:34px;height:34px;border-radius:10px;background:#fff;color:#12A096;display:grid;place-items:center;font:900 18px Heebo,sans-serif}
h1{font:800 24px/1.25 Heebo,sans-serif;margin:16px 0 2px}.hello{margin:0;opacity:.9;font-size:15px}
.main{margin-top:-42px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.steps button{all:unset;cursor:pointer;text-align:center;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.72);padding:7px 2px 0;border-top:4px solid rgba(255,255,255,.3);border-radius:2px}
.steps button.on{color:#fff;border-color:#fff}.steps button.done{color:#fff;border-color:#9FF0DD}
h2{font:800 19px Heebo,sans-serif;margin:0 0 4px}.sub{color:var(--muted);font-size:14.5px;margin:0 0 12px}
.cols{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center}
.cols.h{font-size:12.5px;font-weight:800;color:var(--muted);padding:0 0 6px;border-bottom:1px solid var(--line);margin-bottom:4px;position:sticky;top:0;background:var(--panel);z-index:2;padding-top:6px}
.cols.h span{text-align:center}
.row{padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.row label{font-size:15px;font-weight:600;line-height:1.3}.row small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:11px;padding:10px 10px;width:100%;min-height:46px;outline:none}
input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--soft)}
input[type=number]{text-align:center;direction:ltr;-moz-appearance:textfield}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.add{all:unset;cursor:pointer;color:var(--accent-ink);font-weight:800;font-size:15px;padding:12px 0 2px;display:inline-block}
.f{margin-bottom:12px}.f label{display:block;font-weight:700;font-size:14.5px;margin-bottom:5px}
.bar{position:fixed;inset:auto 0 0 0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;font-weight:800;font-size:16.5px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}.btn[disabled]{opacity:.55;pointer-events:none}.btn.sm{min-height:42px;font-size:14.5px;padding:0 14px;border-radius:12px}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tot div{background:var(--bg);border-radius:12px;padding:10px 12px}.tot small{color:var(--muted);font-size:12.5px;font-weight:700;display:block}.tot b{font-size:17px;font-variant-numeric:tabular-nums}
.need{list-style:none;margin:0;padding:0}.need li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.need li:last-child{border:0}
.need .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--muted);font-weight:800}.need li.ok .ic{background:var(--ok);color:#fff}
.need .t{flex:1;min-width:0}.need .t b{display:block;font-size:15px;line-height:1.3}.need .t small{color:var(--muted);font-size:13px}
.files{margin-top:6px;display:grid;gap:6px}.file{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--bg);border-radius:10px;padding:6px 10px}.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file button{all:unset;cursor:pointer;color:var(--bad);font-weight:800;padding:4px 6px}
.pad{position:relative;border:2px dashed var(--line);border-radius:14px;background:#fff;touch-action:none;height:180px}.pad canvas{width:100%;height:100%;display:block;border-radius:12px}
.pad .ph{position:absolute;inset:0;display:grid;place-items:center;color:#9AA9A8;pointer-events:none;font-size:15px}
.decl{font-size:14px;color:var(--muted);background:var(--bg);border-radius:12px;padding:12px;margin:0 0 12px}
.msg{padding:28px 18px;text-align:center}.msg .big{font-size:46px;line-height:1}.msg b{display:block;font-size:20px;margin:10px 0 6px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14.5px;margin-bottom:12px}
.saved{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 0;min-height:18px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 10px}@keyframes s{to{transform:rotate(360deg)}}
.hidden{display:none!important}
@media (max-width:380px){.cols{grid-template-columns:1fr 80px 80px;gap:6px}}
</style>
<style>
.cta{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:18px;background:var(--accent);color:#fff;font-weight:800;font-size:19px;box-shadow:0 10px 24px -12px var(--accent);margin-bottom:12px}
.cta:active{transform:translateY(1px)}
.cta small{display:block;font-weight:500;font-size:13px;opacity:.9}
.alertc{border:1.5px solid #E6B04A;background:#FFF7E6}.alertc h2{color:#8A5A00}
@media (prefers-color-scheme:dark){.alertc{background:#2B2210;border-color:#8A6A20}.alertc h2{color:#F0C060}}
.okc{border:1.5px solid var(--ok)}
.li2{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.li2:last-child{border-bottom:0}
.li2 .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--muted);font-weight:800;font-size:15px}
.li2.ok .ic{background:var(--ok);color:#fff}.li2.bad .ic{background:var(--bad-soft);color:var(--bad)}
.li2 .t{flex:1;min-width:0}.li2 .t b{display:block;font-size:15px;line-height:1.3}.li2 .t small{color:var(--muted);font-size:13px}
.mini{all:unset;cursor:pointer;color:var(--accent-ink);font-weight:800;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;flex:none}
.sheet-bg{position:fixed;inset:0;background:rgba(5,14,16,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{display:flex;justify-content:space-between;align-items:center}
.x{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--bg);font-size:18px}
.mtog{display:flex;gap:8px;margin:4px 0 14px}.mtog button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px;border-radius:12px;border:1.5px solid var(--line);font-weight:700}.mtog button.on{border-color:var(--accent);background:var(--soft);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:12px;min-height:58px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;line-height:1.25;background:var(--panel)}
.tile.exp{border-color:var(--accent);background:var(--soft)}
.tile:active{background:var(--soft)}
.big-ok{font-size:54px;text-align:center;line-height:1;margin:6px 0}
.grp{font-weight:800;font-size:14px;color:var(--muted);margin:12px 0 2px}
.miss{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14.5px;margin:0 0 12px}
.miss ul{margin:6px 0 0;padding-inline-start:18px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand"><span class="mark">ד</span><span id="oname">משרד עו״ד יקיר דבול</span></div><h1 id="title">הקבלות לדוח לממונה</h1><p class="hello" id="hello">&nbsp;</p></div></header>
<main class="wrap main" id="main"><div class="card msg"><div class="spin"></div>טוען...</div></main>
<div class="bar hidden" id="bar"><div class="wrap"><button class="btn" id="back">הקודם</button><button class="btn pri" id="next">המשך</button></div><div class="saved" id="saved"></div></div>
<input type="file" id="picker" accept="image/*,application/pdf" hidden>
<script src="https://mgjmnvpnovkewvqevjmz.supabase.co/functions/v1/app/config.js?v=f291dc1cb3"></script>
<script>
(function(){
const C = window.OFFICE_CONFIG || {}, API = (C.functions || '') + '/ireport';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₪' + Math.round(+n || 0).toLocaleString('he-IL');
const fmt = s => s ? s.slice(0, 10).split('-').reverse().join('/') : '';
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const mName = k => MONTHS[+String(k).slice(5, 7) - 1] || '';
const main = document.getElementById('main'), bar = document.getElementById('bar'), savedEl = document.getElementById('saved'), picker = document.getElementById('picker');
const token = (location.hash || '').replace(/^#(r=)?/, '').replace(/[^A-Za-z0-9]/g, '');
const INC = [['salary','הכנסה ממשכורת (נטו)','מה שנכנס לבנק, של כל מי שגר בבית','תלוש שכר'],['business','הכנסה מעסק','','דוח מע״מ / מס הכנסה'],['pension','פנסיה','','אישור תשלום פנסיה'],['rentIn','הכנסה משכר דירה','','חוזה שכירות / אישור תשלום'],['nii','קצבאות ביטוח לאומי','קצבת ילדים, נכות, אבטלה וכו׳','אישור ביטוח לאומי'],['alimonyIn','מזונות שמתקבלים','','אישור תשלום מזונות']];
const EXP = [['rent','שכר דירה','','קבלה על שכר דירה'],['mortgage','משכנתא','','אישור תשלום משכנתא'],['arnona','ארנונה','','חשבון ארנונה'],['food','מזון וקניות לבית','','קבלות מהסופר'],['phone','טלפון, כבלים ואינטרנט','','חשבונית'],['mobile','טלפון נייד','','חשבונית'],['gas','גז','','חשבון גז'],['vaad','ועד בית','','קבלה מוועד הבית'],['water','מים','','חשבון מים'],['elec','חשמל','','חשבון חשמל'],['trustee','תשלום חודשי לממונה','','אישור תשלום לממונה'],['medical','הוצאות רפואיות','','קבלות'],['travel','נסיעות לעבודה','תחבורה ציבורית, אם המעביד לא משלם','קבלות / טעינת רב-קו'],['daycare','מעון או מטפלת (ילדים עד גיל 3)','','קבלות'],['alimonyOut','מזונות שאני משלם/ת','','אישור תשלום מזונות'],['travel2','נסיעות אחרות','','קבלות'],['car','אחזקת רכב','ביטוח, דלק, טיפולים','קבלות'],['edu','חינוך ותרבות','חוגים, צהרונים, ספרים','קבלות'],['clothes','ביגוד','','קבלות']];
const LINES = INC.concat(EXP), lineOf = k => LINES.find(x => x[0] === k);
const catName = k => k === 'extra' ? 'הכנסה / הוצאה נוספת' : k === 'other' ? 'מסמך אחר' : ((lineOf(k) || [])[1] || 'מסמך');
const catDoc = k => k === 'extra' ? 'קבלה / אישור' : k === 'other' ? 'מסמך' : ((lineOf(k) || [])[3] || 'קבלה');
let D = null, R = null, P = null, step = 0, saveT = null, dirty = false, mode = 'home';

const fail = (t, s) => { main.innerHTML = `<div class="card msg"><div class="big">🔒</div><b>${esc(t)}</b><p style="color:var(--muted);margin:0">${esc(s || 'אם קיבלת את הקישור מהמשרד, פנה אלינו ונשלח קישור מעודכן.')}</p></div>`; bar.classList.add('hidden'); };
if (!token || !C.functions) return fail('הקישור לא תקין');
const call = body => fetch(API, { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify(Object.assign({ t:token }, body)) }).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || r.status), { code:j.error, status:r.status, data:j }); return j; });
const load = () => fetch(`${API}?t=${encodeURIComponent(token)}`).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => { D = d; Object.values(D.periods || {}).forEach(p => { p.incX = p.incX || []; p.expX = p.expX || []; p.files = p.files || []; }); });
load().then(() => { document.getElementById('oname').textContent = D.office.name || ''; document.getElementById('hello').textContent = D.name ? `שלום ${D.name}` : ''; home(); })
  .catch(e => fail(e === 404 ? 'הקישור לא נמצא או שבוטל' : 'לא הצלחנו לטעון כרגע', e === 404 ? '' : 'בדוק את החיבור לאינטרנט ונסה שוב בעוד כמה דקות.'));

/* ---------- missing receipts (same rule as in the office) ---------- */
const fileFor = (p, cat, mo) => (p.files || []).some(f => f.cat === cat && (!f.month || f.month === mo));
const missing = p => { const out = []; LINES.forEach(([k]) => { const v = (p.inc || {})[k] || (p.exp || {})[k] || []; p.mkeys.forEach((mo, i) => { if (+v[i] > 0 && !fileFor(p, k, mo)) out.push({ k, month:mo }); }); });
  (p.incX || []).concat(p.expX || []).forEach(x => p.mkeys.forEach((mo, i) => { if (+(x.v || [])[i] > 0 && !fileFor(p, 'extra', mo) && !out.some(o => o.k === 'extra' && o.month === mo)) out.push({ k:'extra', month:mo }); })); return out; };
const periodOf = mo => Object.values(D.periods).find(p => p.mkeys.includes(mo));
const contact = () => { const o = D.office || {}, ph = String(o.whatsapp || o.phone || '').replace(/\D/g, ''); return `<div class="card" style="display:flex;gap:10px;align-items:center"><span style="flex:1;font-size:14.5px;color:var(--muted)">שאלה? ${esc(o.lawyer || '')}</span>${o.whatsapp ? `<a class="btn sm" href="https://wa.me/972${ph.replace(/^0/, '')}" target="_blank" rel="noopener">וואטסאפ</a>` : ''}${o.phone ? `<a class="btn sm" href="tel:${esc(String(o.phone).replace(/[^\d+]/g, ''))}">חיוג</a>` : ''}</div>`; };

/* ---------- home: photograph a receipt any time ---------- */
function home(){
  mode = 'home'; bar.classList.add('hidden'); document.getElementById('title').textContent = 'הקבלות לדוח לממונה';
  const cur = D.cur && D.periods[D.cur], close = D.close && D.periods[D.close], nowM = D.now;
  if (!cur && !close) return fail('אין כרגע דוח פתוח', 'המשרד יעדכן אותך כשיגיע הזמן לדוח הבא.');
  let html = '';
  if (close && close.status !== 'filled') { const miss = missing(close);
    html += `<div class="card alertc"><h2>⏰ הגיע הזמן לסגור את הדוח של ${esc(close.label)}</h2><p class="sub" style="margin:4px 0 12px">החודשים נגמרו. בודקים שכל הקבלות צולמו, מאשרים את הסכומים וחותמים. ${close.due ? `חשוב לסיים עד ${fmt(addDays(close.due, -5))}.` : ''}</p>${miss.length ? `<p style="margin:0 0 12px;color:var(--bad);font-weight:700">חסרות עדיין ${miss.length} קבלות</p>` : ''}<button class="btn pri" style="width:100%" data-open="${close.key}">לסגירת הדוח</button></div>`; }
  else if (close && close.status === 'filled') html += `<div class="card okc"><h2>✓ הדוח של ${esc(close.label)} נשלח למשרד</h2><p class="sub" style="margin:4px 0 10px">אנחנו בודקים ומגישים. עד שנבדוק אפשר עוד לתקן.</p><button class="btn sm" data-open="${close.key}">צפייה ותיקון</button></div>`;
  html += `<button class="cta" id="snap"><span style="font-size:26px">📷</span><span>צילום קבלה או מסמך<small>כל קבלה, חשבון או תלוש. מצלמים, וזה נשמר אצלנו</small></span></button>`;
  // what is expected every month, with a mark when it is already here
  if (cur) { const months = cur.mkeys.filter(k => k <= nowM).reverse(), exp = (D.expect || []);
    html += `<div class="card"><h2>${esc(mName(nowM))}: מה צריך לצלם</h2><p class="sub">הממונה מחייב קבלה לכל הכנסה והוצאה בדוח.${exp.length ? ' זו הרשימה לפי הדוח הקודם שלך.' : ' כל מה ששילמת או קיבלת החודש.'}</p>${(exp.length ? exp : ['rent', 'arnona', 'elec', 'water', 'food', 'salary']).map(k => { const n = (cur.files || []).filter(f => f.cat === k && f.month === nowM).length;
      return `<div class="li2 ${n ? 'ok' : ''}"><span class="ic">${n ? '✓' : '·'}</span><div class="t"><b>${esc(catDoc(k))}</b><small>${esc(catName(k))}${n ? ` · צולמו ${n}` : ' · עוד לא צולם'}</small></div><button class="mini" data-snap="${k}">${n ? 'עוד' : 'צילום'}</button></div>`; }).join('')}</div>`;
    const list = (cur.files || []).slice().reverse();
    html += `<div class="card"><h2>צילמת בתקופה הזו (${list.length})</h2>${list.length ? months.map(mo => { const fs = list.filter(f => f.month === mo); return fs.length ? `<div class="grp">${esc(mName(mo))}</div>` + fs.map(f => `<div class="li2 ok"><span class="ic">✓</span><div class="t"><b>${esc(catName(f.cat))}</b><small>${+f.amount ? money(f.amount) + ' · ' : ''}${esc(f.name)}</small></div>${f.path ? `<button class="mini" data-rm="${esc(f.path)}" aria-label="הסרה" style="color:var(--bad)">✕</button>` : ''}</div>`).join('') : ''; }).join('') : '<p class="sub" style="margin:0">עוד לא צילמת כלום החודש. כל קבלה שמגיעה: לוחצים על הכפתור הירוק ומצלמים.</p>'}</div>`;
  }
  html += hist() + contact();
  main.innerHTML = html;
  document.getElementById('snap').onclick = () => sheet();
  main.querySelectorAll('[data-snap]').forEach(b => b.onclick = () => sheet(b.dataset.snap));

const hist = () => (D.history || []).length ? `<div class="card"><h2 style="font-size:16px">דוחות שהוגשו</h2>${D.history.map(h => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px"><span>${esc(h.label)}</span><span style="color:var(--ok);font-weight:700">✓ ${h.at ? fmt(h.at) : 'הוגש'}</span></div>`).join('')}</div>` : '';

async function removeFile(path){ if (!confirm('להסיר את הקובץ?')) return; try { await call({ op:'unfile', path }); Object.values(D.periods).forEach(p => p.files = p.files.filter(f => f.path !== path)); mode === 'home' ? home() : render(); } catch(e) { alert('ההסרה נכשלה. נסה שוב.'); } }

/* ---------- the capture sheet: what is it -> camera -> (amount) ---------- */

      <div class="tiles">${order.map(k => `<button class="tile${exp.includes(k) ? ' exp' : ''}" data-c="${k}">${esc(catDoc(k))}<br><small style="font-weight:500;color:var(--muted)">${esc(catName(k))}</small></button>`).join('')}<button class="tile" data-c="extra">הכנסה או הוצאה אחרת</button><button class="tile" data-c="other">מסמך אחר</button></div></div>`;

/* photos are shrunk before upload so the final PDF stays small */
const shrink = f => new Promise(res => { if (!/^image\//.test(f.type) || /gif|svg/.test(f.type)) return res(f);

async function upload(files, cat, month, bg, close){

    <div class="f"><label for="amt">כמה היה בקבלה? (לא חובה, חוסך מילוי בסוף)</label><input id="amt" type="number" inputmode="decimal" placeholder="סכום בשקלים"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn pri" id="done">סיום</button><button class="btn" id="more">📷 עוד קבלה</button></div>`;

/* ---------- closing a report: amounts, receipts check, signature ---------- */

const v = (o, k, i) => { const x = ((o || {})[k] || [])[i]; return x === '' || x == null ? '' : x; };

function render(){

  document.getElementById('back').style.display = step ? '' : 'none';

function bind(){

  main.querySelectorAll('input[data-x]').forEach(el => el.oninput = () => { const x = R[el.dataset.x][+el.dataset.i]; if (el.dataset.f === 'label') x.label = el.value; else x.v[+el.dataset.f] = el.value === '' ? '' : +el.value; changed(); updTot(); });
  main.querySelectorAll('[data-addx]').forEach(b => b.onclick = () => { R[b.dataset.addx].push({ label:'', v:['', ''] }); render(); const ins = main.querySelectorAll(`[data-x="${b.dataset.addx}"][data-f="label"]`); ins[ins.length - 1].focus(); });

  ['address', 'phone'].forEach(k => { const el = document.getElementById(k); if (el) el.oninput = () => { R[k] = el.value; changed(); }; });
  main.querySelectorAll('[data-snap]').forEach(b => b.onclick = () => sheet(b.dataset.snap, b.dataset.mo));

}
function updTot(){ const T = totals(), g = step === 0 ? 'inc' : 'exp', b = main.querySelectorAll('.tot b'); if (b.length === 2) { b[0].textContent = money(T[g][0]); b[1].textContent = money(T[g][1]); } }
function changed(){ dirty = true; savedEl.textContent = ''; clearTimeout(saveT); saveT = setTimeout(save, 1500); }
const payload = () => ({ key:R.key, inc:R.inc, exp:R.exp, incX:R.incX, expX:R.expX, persons:R.persons, address:R.address, phone:R.phone });
async function save(){ if (!dirty || !R) return true; clearTimeout(saveT); dirty = false;
  try { await call(Object.assign({ op:'save' }, payload())); savedEl.textContent = 'נשמר ✓'; return true; }
  catch(e) { dirty = true; savedEl.textContent = e.code === 'locked' ? 'הדוח כבר בבדיקה במשרד' : 'לא נשמר. בדוק את החיבור לאינטרנט.'; return false; } }
async function go(s){ await save(); step = Math.max(0, Math.min(3, s)); render(); window.scrollTo(0, 0); }
document.getElementById('back').onclick = () => go(step - 1);
document.getElementById('next').onclick = () => step < 3 ? go(step + 1) : submit();
window.addEventListener('beforeunload', e => { if (dirty) { save(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });

let drawn = false, cv = null;
function pad(){
  cv = document.querySelector('#pad canvas'); const ph = document.getElementById('ph'); const r = cv.getBoundingClientRect(), dpr = Math.max(2, window.devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr; const x = cv.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.6; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0d2a5c'; drawn = false;

// the signature, trimmed to its ink and on a transparent background
function sigPng(){ const w = cv.width, h = cv.height, d = cv.getContext('2d').getImageData(0, 0, w, h).data; let a = w, b = h, c = 0, e = 0;

async function submit(){

    bar.classList.add('hidden'); main.innerHTML = `<div class="card msg"><div class="big">✅</div><b>הדוח נשלח למשרד</b><p style="color:var(--muted);margin:0 0 14px">תודה! נבדוק ונגיש לממונה. אם יחסר משהו נחזור אליך. ממשיכים לצלם קבלות של החודש כרגיל.</p><button class="btn pri" id="h2" style="margin:0 auto">חזרה לדף הקבלות</button></div>`; document.getElementById('h2').onclick = () => load().then(home); window.scrollTo(0, 0); }

    err.innerHTML = `<div class="err" style="margin-top:12px">${e.code === 'missing' ? 'חסרות קבלות. משלימים בשלב 3 ושולחים שוב.' : e.code === 'early' ? 'אפשר לשלוח רק אחרי שהחודשים נגמרו.' : e.code === 'locked' ? 'הדוח כבר בבדיקה במשרד ולא ניתן לשנות אותו.' : 'השליחה נכשלה. בדוק את החיבור לאינטרנט ונסה שוב.'}</div>`; }
}
})();

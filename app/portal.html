<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#13243B">
<title>מעקב אחרי העסקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
:root{--bg:#F6F3EC;--panel:#fff;--ink:#1C2430;--navy:#13243B;--navy2:#23395A;--muted:#5B6472;--line:#E7E1D4;--gold:#C9A15F;--gold-d:#9A7638;--gold-l:#E8D3A6;--cream:#F3EBDC;--ok:#2F8F6B;--r:20px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Frank Ruhl Libre",Georgia,serif}
.bar{background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.logo{height:46px;width:auto;display:block}
.upd{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}.upd i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
main.wrap{padding-top:26px;padding-bottom:48px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px}
.hero{background:var(--navy);color:#fff;border-radius:var(--r);padding:30px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:26px}
.hero .txt{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:12px}
.kick{font-size:14px;letter-spacing:.04em;color:#D9C08F;font-weight:600}
.hero h1{margin:0;font:700 42px/1.12 "Frank Ruhl Libre",Georgia,serif;text-wrap:balance}
.hero p{margin:0;font-size:18px;color:#D5DCE6}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px}
.chip{border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.chip.o{border:1px solid #B08A4A;color:var(--gold-l)}.chip.f{background:var(--navy2);color:#fff}
.ring{display:flex;align-items:center;gap:18px;flex:1 0 auto}
.ring b{display:block;font-size:30px;line-height:1}.ring span{font-size:15px;color:#D5DCE6}
.next{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.next .l{display:flex;align-items:flex-start;gap:18px;flex:999 1 380px;min-width:0}
.ico{width:52px;height:52px;border-radius:14px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:none}
.lab{font-size:14px;font-weight:700;color:var(--gold-d)}
.next h2{margin:2px 0;font:700 30px/1.2 "Frank Ruhl Libre",Georgia,serif;color:var(--navy)}
.next .sub{color:#4A5361}
.todo{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.todo span{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--navy)}
.count{background:var(--navy);color:#fff;border-radius:16px;padding:14px 22px;text-align:center;flex:none}
.count b{display:block;font-size:34px;line-height:1}.count span{font-size:14px;color:#D5DCE6}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.date{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;gap:2px}
.date small{font-size:14px;color:var(--muted);font-weight:600}.date b{font-size:24px;color:var(--navy);font-variant-numeric:tabular-nums}.date span{font-size:14px;color:var(--muted)}.date span.soon{color:var(--gold-d);font-weight:600}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.cols>.mainc{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:20px}
.cols>aside{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:20px}
h3{margin:0 0 18px;font:700 26px "Frank Ruhl Libre",Georgia,serif;color:var(--navy)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:16px}
.rail{display:flex;flex-direction:column;align-items:center;width:34px;flex:none}
.dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;background:#fff;color:#6B7380;border:2px solid #D5D9E0}
.done .dot{background:var(--navy);color:#fff;border-color:var(--navy)}
.cur .dot{background:var(--gold);color:var(--navy);border-color:var(--gold);box-shadow:0 0 0 6px var(--cream)}
.ln{width:2px;flex:1;min-height:22px;background:#D5D9E0}.done .ln{background:var(--navy)}
.steps li:last-child .ln{display:none}
.st{padding-bottom:20px;display:flex;flex-direction:column;gap:2px;min-width:0}
.st b{font-size:18px;color:var(--navy)}.cur .st b{color:var(--gold-d)}.fut .st b{color:var(--muted)}
.st small{font-size:14px;color:var(--muted)}
.files{display:grid;gap:10px}
.file{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);min-height:56px}
.file .fi{width:42px;height:42px;border-radius:10px;background:var(--cream);color:var(--gold-d);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;font-size:12px}
.file b{display:block;font-size:15.5px;line-height:1.3;color:var(--navy)}.file small{color:var(--muted);font-size:13px}
.file .dl{margin-inline-start:auto;color:var(--navy);font-weight:700;font-size:14px;white-space:nowrap}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--muted);font-size:13px;font-weight:700}td.n{font-variant-numeric:tabular-nums;white-space:nowrap}.ok{color:var(--ok);font-weight:700}.wait{color:var(--muted)}
.law{display:flex;align-items:center;gap:14px}
.law img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold-l)}
.law b{display:block;font-size:18px;color:var(--navy)}.law span{font-size:14px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border-radius:12px;text-decoration:none;font-weight:700;font-size:16px}
.btn.p{background:var(--navy);color:#fff}.btn.s{border:1px solid #C9D3DF;color:var(--navy);background:#fff}
.contact{display:flex;flex-direction:column;gap:12px}
.addr{font-size:14px;color:var(--muted);text-align:center}
.review{background:var(--cream);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:10px}
.review h3{margin:0;font-size:22px}.review p{margin:0;color:#4A5361}
.review a{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:12px;background:#fff;color:var(--navy);text-decoration:none;font-weight:700;border:1px solid #D9C08F}
.stars{display:flex;gap:6px}
.foot{text-align:center;color:#6B7380;font-size:13px;margin:6px 0 0}
.center{text-align:center;padding:40px 20px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}
@media (max-width:560px){.hero{padding:24px}.hero h1{font-size:32px}.card{padding:20px}.next h2{font-size:26px}.logo{height:40px}}
</style>
</head>

    next = `<section class="card next"><div class="l"><div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9A7638" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9"/><path d="M17 6l3 3"/><path d="M15 8l2 2"/></svg></div>
      <div style="min-width:0"><span class="lab">השלב הבא</span><h2>${esc(x.next.label)}</h2><span class="sub">${n != null && n >= 0 ? esc(long(x.next.expected)) + '. נעדכן אתכם לפני המועד.' : 'אנחנו מטפלים בזה עכשיו.'}</span>
      ${hints.length ? `<div class="todo">${hints.map(h => `<span>${check}${esc(h)}</span>`).join('')}</div>` : ''}</div></div>
      ${n != null && n >= 0 ? `<div class="count"><b>${n === 0 ? 'היום' : n}</b><span>${n === 0 ? '' : n === 1 ? 'יום' : 'ימים'}</span></div>` : ''}</section>`;
  } else next = `<section class="card next"><div class="l"><div><span class="lab">סטטוס</span><h2>כל השלבים הושלמו</h2><span class="sub">תודה שבחרתם בנו.</span></div></div></section>`;
  const last = steps.length ? steps[steps.length - 1] : null;
  const dateCard = (label, s, done) => `<div class="date"><small>${esc(label)}</small><b>${s ? fmt(s) : 'טרם נקבע'}</b><span class="${s && days(s) >= 0 && days(s) <= 14 ? 'soon' : ''}">${s ? (done ? 'הושלם' : rel(s)) : 'נעדכן ברגע שייקבע'}</span></div>`;
  const dates = `<section class="dates">${dateCard('חתימת החוזה', d.signDate)}${dateCard('מסירת החזקה', d.handDate)}${last && (last.expected || last.date) ? dateCard(last.label, last.done ? last.date : last.expected, last.done) : ''}</section>`;
  const stepHtml = steps.map((s, i) => { const cls = s.done ? 'done' : i === cur ? 'cur' : 'fut';
    const sub = s.done ? `הושלם${s.date ? ' ב-' + fmt(s.date) : ''}` : i === cur ? (s.expected && days(s.expected) >= 0 ? `בטיפול עכשיו · יעד ${fmt(s.expected)}` : 'בטיפול עכשיו') : s.expected && days(s.expected) >= 0 ? `צפוי בערך ב-${fmt(s.expected)}` : 'בהמשך';
    return `<li class="${cls}"><div class="rail"><span class="dot">${s.done ? '✓' : i + 1}</span><span class="ln"></span></div><div class="st"><b>${esc(s.label)}</b><small>${sub}</small></div></li>`; }).join('');
  const files = (x.files || []).length ? `<section class="card"><h3>המסמכים שלכם</h3><div class="files">${x.files.map(f => `<a class="file" href="${esc(f.url)}" target="_blank" rel="noopener" download><span class="fi">${esc((String(f.name).split('.').pop() || 'PDF').slice(0, 4).toUpperCase())}</span><div><b>${esc(f.title)}</b><small>${esc(f.kind)}${f.date ? ' · ' + fmt(f.date) : ''}</small></div><span class="dl">הורדה</span></a>`).join('')}</div></section>` : '';
  const pays = x.payments || [];
  const payHtml = pays.length ? `<section class="card"><h3>לוח התשלומים לפי החוזה</h3><div class="tbl"><table><thead><tr><th>מועד</th><th>סכום</th><th>תיאור</th><th></th></tr></thead><tbody>${pays.map(p => `<tr><td class="n">${fmt(p.date)}</td><td class="n">${money(p.amount)}</td><td>${esc(p.desc)}</td><td class="${p.paid ? 'ok' : 'wait'}">${p.paid ? '✓ שולם' : days(p.date) >= 0 ? rel(p.date) : 'ממתין לעדכון'}</td></tr>`).join('')}</tbody></table></div></section>` : '';
  const wa = phoneDigits(o.whatsapp), tel = phoneDigits(o.phone);
  const contact = `<section class="card contact"><div class="law"><img src="${PHOTO}" alt="${esc(o.lawyer || 'עו״ד יקיר דבול')}" onerror="this.remove()"><div><b>${esc(o.lawyer || 'עו״ד יקיר דבול')}</b><span>מלווה את העסקה שלכם</span></div></div>
    ${tel ? `<a class="btn p" href="tel:${tel}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>התקשרו למשרד ${esc(o.phone)}</a>` : ''}
    ${wa ? `<a class="btn s" href="https://wa.me/972${wa.slice(1)}?text=${encodeURIComponent('שלום, לגבי העסקה ב' + (d.address || '') + ':')}" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#13243B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 20.5l1.8-5.2A8.4 8.4 0 1 1 21 11.5z"/></svg>הודעה בוואטסאפ</a>` : ''}
    <span class="addr">${o.address ? esc(o.address) + ' · ' : ''}פגישה במשרד, בבית שלכם או בזום</span></section>`;
  const review = `<section class="review"><div class="stars" role="img" aria-label="5 כוכבים">${star.repeat(5)}</div><h3>הליווי שלנו עזר לכם?</h3><p>ביקורת קצרה בגוגל עוזרת לאנשים נוספים למצוא אותנו. זה לוקח דקה.</p><a href="${REVIEW}" target="_blank" rel="noopener">כתיבת ביקורת בגוגל</a></section>`;
  main.innerHTML = `${hero}${next}${dates}<div class="cols"><div class="mainc"><section class="card"><h3>שלבי העסקה</h3><ol class="steps">${stepHtml}</ol></section>${files}${payHtml}</div><aside>${contact}${review}</aside></div>
    <p class="foot">הדף מתעדכן אוטומטית מתוך תיק העסקה במשרד · נכון ל-${fmt(new Date().toISOString())}</p>`;
  requestAnimationFrame(() => setTimeout(() => { const a = document.getElementById('arc'); if (a) a.setAttribute('stroke-dasharray', `${dash} ${Math.round(C2)}`); }, 60));
}
})();
</script>
</body>
</html>

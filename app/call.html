<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>חיוג</title>
<style>
:root{--bg:#EEF2F1;--panel:#fff;--ink:#0E2226;--muted:#62797A;--accent:#B4532A}
@media(prefers-color-scheme:dark){:root{--bg:#081517;--panel:#0F2225;--ink:#E7EEEC;--muted:#8FA6A4;--accent:#E98E5C}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px Assistant,Arial,sans-serif;padding:16px;box-sizing:border-box}
.c{background:var(--panel);border-radius:18px;padding:26px 22px;text-align:center;max-width:360px;width:100%}
a{display:block;margin-top:16px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;font-size:20px;border-radius:14px;padding:16px}
p{color:var(--muted);margin:8px 0 0;font-size:15px}
</style>
</head>
<body>
<div class="c"><b>חיוג ללקוח</b><div id="n" dir="ltr" style="margin-top:6px;font-size:22px"></div><a id="go" href="#">📞 חיוג עכשיו</a><p>אם החיוג לא נפתח לבד, לוחצים על הכפתור.</p></div>
<script>
(function () {
  // used by the office Telegram reminders ("לחזור אליו ב..."): Telegram buttons must be https links, so this page opens the dialer
  var n = (new URLSearchParams(location.search).get('n') || '').replace(/[^\d+]/g, '');
  if (n && n.charAt(0) !== '+') n = '+' + n;
  var go = document.getElementById('go');
  document.getElementById('n').textContent = n || 'אין מספר';
  if (!n || n.length < 8) { go.style.display = 'none'; return; }
  go.href = 'tel:' + n;
  setTimeout(function () { location.href = 'tel:' + n; }, 150);
})();
</script>
</body>
</html>
